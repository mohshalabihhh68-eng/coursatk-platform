<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>مشغل المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* كل الـ CSS زي ما هو بالضبط (من profile أو styles) */
:root{
  --bg:#080d18;--panel:#111a2a;--panel2:#172338;--line:#26344b;
  --text:#f3f6ff;--muted:#91a0ba;--blue:#5b8cff;--blue2:#8ab4ff;--green:#34d399;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 380px at 50% -180px,#173b76 0,transparent 70%),var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}

/* باقي الـ CSS كامل (انسخ كل الـ .top .player-card .screen .ptop .pcenter إلخ من أي ملف) */
</style>
</head>
<body>

<!-- باقي الـ HTML كامل زي ما هو (من header للـ videoList) ... -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function(){
'use strict';

// كل الـ consts والـ functions القديمة (saveProgress، playIndex، init، الـ rewritePlaylist، الـ HLS config، إلخ)
// + الإصلاحات: HLS debug=false، maxBufferSize، fallback أفضل

// ... (الكود الكامل زي ما بعته في الـ response السابق، بس مع الإصلاحات اللي قلتها قبل كده)

// الجزء المهم:
let fixedVariant=rewritePlaylist(variantText,streamToken,currentKeyBlobUrl,varBase,varFileUrl);
// وفي rewritePlaylist استخدم النسخة اللي صلحتها في server.js

// الـ playIndex:
if(window.Hls&&Hls.isSupported()){
  hls=new Hls({
    enableWorker:true,
    maxBufferLength:30,
    maxMaxBufferLength:60,
    backBufferLength:15,
    startPosition:resumeAt||-1,
    debug:false,
    maxBufferSize:10*1024*1024,
    maxBufferHole:1,
    maxBufferRetry:3
  });
  // ... باقي الكود كامل
}

init();
})();
</script>
</body>
</html>
