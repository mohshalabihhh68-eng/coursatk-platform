<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>مشغل المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d18;--panel:#111a2a;--panel2:#172338;--line:#26344b;
  --text:#f3f6ff;--muted:#91a0ba;--blue:#5b8cff;--blue2:#8ab4ff;--green:#34d399;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(900px 380px at 50% -180px,#173b76 0,transparent 70%),var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}

.top{position:sticky;top:0;z-index:100;background:#080d18ef;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12}
.topin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);box-shadow:0 8px 24px #2563eb40}
.brand-txt b{display:block;font-size:14px;font-weight:900;line-height:1.1}
.brand-txt span{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:2px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .18s;white-space:nowrap}
.btn:hover{background:#ffffff12}
.btn svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:1180px;margin:auto;padding:16px 14px 60px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.main{min-width:0}

.player-card{background:linear-gradient(180deg,#131d30,#0f1726);border:1px solid #ffffff16;border-radius:20px;overflow:hidden;box-shadow:0 25px 80px #0004}
.screen{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden;isolation:isolate}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1}

.loading{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000a;font-weight:800;font-size:13px;color:#fff}
.loading.hide{display:none}
.spin{width:38px;height:38px;border:3px solid #ffffff30;border-top-color:var(--blue2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.error{display:none;position:absolute;inset:0;background:linear-gradient(#080d18f7,#0a1222fa);z-index:16;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:14px 18px}
.error.show{display:flex}
.error b{font-size:14.5px;font-weight:900}
.error p{color:var(--muted);margin:0;font-size:12px}
.ctrl{border:1px solid #ffffff14;background:#ffffff08;color:#fff;border-radius:12px;padding:9px 14px;font-weight:800;margin-top:10px}
.ctrl:hover{background:#ffffff18}

.titlebox{padding:16px 2px 0}
.titlebox h1{font-size:20px;margin:0 0 10px;font-weight:900}
.controls-under{display:flex;align-items:center;gap:8px;padding:14px 0 0}

.panel{background:linear-gradient(155deg,#15233aee,#0d1524f5);border:1px solid #8ab4ff20;border-radius:20px;overflow:hidden;box-shadow:0 22px 70px #0003;position:sticky;top:78px}
.panel-head{padding:16px;border-bottom:1px solid #ffffff0c}
.panel-head h2{font-size:14px;margin:0;font-weight:900}
.list{padding:9px 10px 13px;display:flex;flex-direction:column;gap:7px;max-height:min(62vh,680px);overflow:auto}
.item{display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;cursor:pointer;background:#ffffff05;border:1px solid transparent;transition:.2s}
.item:hover{background:#ffffff08}
.item.active{background:linear-gradient(105deg,#477ff51b,#477ff508);border-color:#5b8cff45}
.itemtitle{font-size:12px;font-weight:800}

@media(max-width:900px){
  .layout{grid-template-columns:1fr;gap:16px}
  .panel{position:relative;top:auto}
  .list{max-height:440px}
}
</style>
</head>
<body>

<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5"/></svg>
      </div>
      <div class="brand-txt">
        <b>ثانوية club</b>
        <span>مشغل المحاضرة</span>
      </div>
    </div>
    <div class="grow"></div>
    <button class="btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      رجوع
    </button>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <div class="main">
      <div class="player-card">
        <div class="screen" id="screen">
          <video id="video" controls playsinline crossorigin="anonymous"></video>
          <div class="loading" id="loading">
            <div class="spin"></div>
            <span>جاري تحميل الفيديو...</span>
          </div>
          <div class="error" id="error">
            <b>عذراً، حدث خطأ</b>
            <p id="errorMsg">تعذر تحميل الفيديو.</p>
            <button class="ctrl" onclick="location.reload()">إعادة المحاولة</button>
          </div>
        </div>
      </div>
      <div class="titlebox">
        <h1 id="pageTitle">مشاهدة المحاضرة</h1>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>محتوى المحاضرة</h2>
      </div>
      <div class="list" id="videosList">
        <!-- قائمة الفيديوهات هتظهر هنا -->
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

const API_BASE = '';
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const lectureId = qs.get('lectureId');
const videoId = qs.get('videoId');

const videoEl = $('video');
const loading = $('loading');
const errorBox = $('error');
const errorMsg = $('errorMsg');

if (!lectureId || !videoId) {
  showError('معرف المحاضرة أو الفيديو غير موجود في الرابط.');
}

function showError(msg) {
  loading.classList.add('hide');
  errorBox.classList.add('show');
  errorMsg.textContent = msg;
}

// 1. طلب محتوى المحاضرة عشان نجيب بيانات الفيديو الحقيقية
async function loadVideoContent() {
  try {
    loading.classList.remove('hide');
    const res = await fetch(API_BASE + '/api/lectures/' + lectureId + '/content');
    const data = await res.json();
    
    if (!res.ok || data.success === false) {
      throw new Error(data.message || 'فشل في جلب بيانات المحاضرة');
    }

    const videos = data.data?.videos || data.body?.data?.videos || data.body?.videos || [];
    
    if (videos.length > 0) {
      // تحديث القائمة الجانبية
      renderList(videos);
      
      // تشغيل الفيديو المطلوب
      const currentVideo = videos.find(v => String(v.id) === String(videoId)) || videos[0];
      if (currentVideo) {
        $('pageTitle').textContent = currentVideo.title || 'مشاهدة المحاضرة';
        await playVideo(currentVideo.id);
      } else {
        throw new Error('الفيديو المطلوب غير موجود في هذه المحاضرة.');
      }
    } else {
      throw new Error('لا توجد فيديوهات متاحة لهذه المحاضرة.');
    }
  } catch (err) {
    showError(err.message || 'حدث خطأ أثناء جلب المحتوى.');
  }
}

// 2. طلب رابط التشغيل من السيرفر وتشغيله
async function playVideo(id) {
  try {
    loading.classList.remove('hide');
    errorBox.classList.remove('show');
    
    // بنكلم السيرفر بتاعنا اللي بيكلم المنصة الأصلية ويرجع اللينك
    const res = await fetch(API_BASE + '/api/video/' + id + '/play', { method: 'POST' });
    const data = await res.json();
    
    if (!res.ok || data.success === false) {
      throw new Error(data.message || 'تعذر الحصول على رابط تشغيل الفيديو');
    }

    // استخراج رابط الفيديو والتوكن (حسب شكل الرد اللي جاي من السيرفر)
    const payload = data.data || data.body?.data || data.body || data;
    
    // السيرفر بيرجع مسار (path) وتوكن (token) للمشغل بتاع stream-weave
    if (payload.token && payload.path) {
      // بنبعت الفيديو للمسار اللي إحنا عملينه في server.js واللي بيقرأ الـ m3u8 ويفك تشفيره
      videoEl.src = `/api/stream?path=${encodeURIComponent(payload.path)}&t=${encodeURIComponent(payload.token)}`;
    } 
    // لو السيرفر رجع رابط مباشر (hls_url أو url)
    else if (payload.hls_url) {
      videoEl.src = payload.hls_url;
    } else if (payload.url) {
      videoEl.src = payload.url;
    } else {
      throw new Error('لم يتم العثور على رابط فيديو صالح في رد السيرفر.');
    }

    videoEl.load();
    videoEl.play().catch(e => {
       console.log('المتصفح منع التشغيل التلقائي، محتاج المستخدم يدوس بلاي');
    });

    videoEl.oncanplay = () => {
      loading.classList.add('hide');
    };

  } catch (err) {
    showError(err.message || 'حدث خطأ أثناء تشغيل الفيديو.');
  }
}

function renderList(videos) {
  const list = $('videosList');
  list.innerHTML = '';
  videos.forEach(v => {
    const el = document.createElement('div');
    el.className = 'item' + (String(v.id) === String(videoId) ? ' active' : '');
    el.innerHTML = `
      <div class="itemtitle">${v.title}</div>
    `;
    el.onclick = () => {
      $('pageTitle').textContent = v.title;
      document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      playVideo(v.id);
    };
    list.appendChild(el);
  });
}

// بدء التشغيل
if (lectureId && videoId) {
  loadVideoContent();
}

})();
</script>
</body>
</html>
