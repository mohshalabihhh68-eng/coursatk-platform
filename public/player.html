<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مشغل المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080d18;--panel:#111a2a;--line:#26344b;--text:#f3f6ff;--muted:#91a0ba;--blue:#5b8cff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif;height:100vh;display:flex;flex-direction:column}
.top{background:#080d18ef;border-bottom:1px solid #ffffff12;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900}
.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;margin-right:auto}
.wrap{flex:1;position:relative;background:#000}
iframe{width:100%;height:100%;border:none}
.loading{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#fff;z-index:10}
.spin{width:38px;height:38px;border:3px solid #ffffff30;border-top-color:#5b8cff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{position:absolute;inset:0;background:#080d18;display:none;align-items:center;justify-content:center;flex-direction:column;color:#ff5252;padding:20px;text-align:center;z-index:20}
</style>
</head>
<body>
  <header class="top">
    <div class="brand">ثانوية club</div>
    <button class="btn" onclick="history.back()">رجوع للمحتوى</button>
  </header>
  
  <div class="wrap" id="player-wrap">
    <div class="loading" id="loading">
      <div class="spin"></div>
      <span>جاري تحميل الفيديو...</span>
    </div>
    <div class="error" id="error">
      <div id="err-text">حدث خطأ</div>
    </div>
  </div>

<script>
(async function(){
  const API_BASE = '';
  const TOKEN_KEY = 'cstk_tok';
  const token = localStorage.getItem(TOKEN_KEY);
  
  if (!token) { window.location.replace('index.html'); return; }
  
  const qs = new URLSearchParams(location.search);
  const lectureId = qs.get('lectureId');
  const videoId = qs.get('videoId');
  
  if (!lectureId || !videoId) {
    showErr('رابط المشغل ناقص.');
    return;
  }
  
  try {
    // طلب البيانات من السيرفر
    const res = await fetch(API_BASE + `/api/video/${videoId}/play`, { method: 'POST' });
    const data = await res.json();
    
    if (!res.ok || !data.success) throw new Error(data.message || 'فشل جلب بيانات الفيديو');
    
    // الرابط الجاهز من الـ API
    const streamUrl = data.data.stream_url;
    if (!streamUrl) throw new Error('لم يتم العثور على رابط البث');
    
    // إخفاء التحميل وعرض الـ iframe
    document.getElementById('loading').style.display = 'none';
    const iframe = document.createElement('iframe');
    iframe.src = streamUrl;
    iframe.allow = "autoplay; fullscreen; encrypted-media";
    iframe.allowFullscreen = true;
    document.getElementById('player-wrap').appendChild(iframe);
    
  } catch (e) {
    showErr(e.message);
  }
  
  function showErr(msg) {
    document.getElementById('loading').style.display = 'none';
    const errDiv = document.getElementById('error');
    errDiv.style.display = 'flex';
    document.getElementById('err-text').textContent = msg;
  }
})();
</script>
</body>
</html>
