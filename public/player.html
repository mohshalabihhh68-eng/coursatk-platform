<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>مشغل المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080d18;--panel:#111a2a;--line:#26344b;--text:#f3f6ff;--muted:#91a0ba;--blue:#5b8cff;--blue2:#8ab4ff;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif;}
button{cursor:pointer;border:0;background:none;color:inherit;}
.top{position:sticky;top:0;z-index:100;background:#080d18ef;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12}
.topin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:900;display:flex;align-items:center;gap:10px;}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#60a5fa,#1d4ed8);display:grid;place-items:center;}
.brand-txt b{display:block;font-size:14px;}
.brand-txt span{display:block;font-size:10px;color:var(--muted);}
.grow{flex:1;}
.btn{border:1px solid var(--line);background:#ffffff08;color:var(--text);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;}
.wrap{max-width:1180px;margin:auto;padding:16px 14px;}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.main{min-width:0}
.player-card{background:#131d30;border:1px solid #ffffff16;border-radius:20px;overflow:hidden;box-shadow:0 25px 80px #0004}
.screen{position:relative;background:#000;aspect-ratio:16/9;}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
.loading{position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000a;font-weight:800;font-size:13px;color:#fff;}
.loading.hide{display:none}
.spin{width:38px;height:38px;border:3px solid #ffffff30;border-top-color:var(--blue2);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{display:none;position:absolute;inset:0;background:#0a1222fa;z-index:16;align-items:center;justify-content:center;flex-direction:column;gap:8px;text-align:center;padding:14px;}
.error.show{display:flex}
.error b{font-size:14.5px;}
.error p{color:var(--muted);margin:0;font-size:12px;line-height:1.6;word-break:break-all;}
.ctrl{border:1px solid #ffffff14;background:#ffffff08;color:#fff;border-radius:12px;padding:9px 14px;font-weight:800;margin-top:10px;}
.titlebox{padding:16px 2px 0}
.titlebox h1{font-size:20px;margin:0 0 10px;font-weight:900}
.panel{background:#111a2a;border:1px solid #8ab4ff20;border-radius:20px;overflow:hidden;position:sticky;top:78px}
.panel-head{padding:16px;border-bottom:1px solid #ffffff0c}
.panel-head h2{font-size:14px;margin:0;}
.list{padding:9px;display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 200px);overflow:auto}
.item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;cursor:pointer;background:#ffffff05;border:1px solid transparent;}
.item:hover{background:#ffffff08}
.item.active{background:#477ff51b;border-color:#5b8cff45}
.itemtitle{font-size:12px;font-weight:800;}
@media(max-width:900px){.layout{grid-template-columns:1fr;}.panel{position:relative;top:auto;}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5"/></svg></div>
      <div class="brand-txt"><b>ثانوية club</b><span>مشغل المحاضرة</span></div>
    </div>
    <div class="grow"></div>
    <button class="btn" onclick="history.back()">← رجوع</button>
  </div>
</header>

<div class="wrap">
  <div class="layout">
    <div class="main">
      <div class="player-card">
        <div class="screen">
          <video id="video" controls playsinline crossorigin="anonymous"></video>
          <div class="loading" id="loading"><div class="spin"></div><span id="loadingText">جاري تحميل الفيديو...</span></div>
          <div class="error" id="error">
            <b>عذراً، حدث خطأ</b><p id="errorMsg">تعذر تحميل الفيديو.</p>
            <button class="ctrl" onclick="location.reload()">إعادة المحاولة</button>
          </div>
        </div>
      </div>
      <div class="titlebox"><h1 id="pageTitle">مشاهدة المحاضرة</h1></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>محتوى المحاضرة</h2></div>
      <div class="list" id="videosList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(function(){
  const API_BASE = '';
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const lectureId = qs.get('lectureId');
  const videoId = qs.get('videoId');
  
  const videoEl = $('video');
  const loading = $('loading');
  const loadingText = $('loadingText');
  const errorBox = $('error');
  const errorMsg = $('errorMsg');
  
  let hls = null;
  let cryptoUtils = null;
  let hbTimer = null;
  let currentKeyBlobUrl = null;
  let currentPlaylistBlobUrl = null;

  function showError(msg) {
    loading.classList.add('hide');
    errorBox.classList.add('show');
    errorMsg.textContent = msg;
  }

  function toB64url(str) {
    return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
  }
  function fromB64url(value) {
    var s = String(value).replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return decodeURIComponent(escape(atob(s)));
  }
  function joinRel(base, rel) {
    var q = ""; var relPath = String(rel); var qi = relPath.indexOf("?");
    if (qi !== -1) { q = relPath.slice(qi); relPath = relPath.slice(0, qi); }
    var stack = String(base || "").split("/");
    if (stack.length && stack[stack.length - 1] !== "" && /\.[a-z0-9]+$/i.test(stack[stack.length - 1])) stack.pop();
    if (stack.length && stack[stack.length - 1] === "") stack.pop();
    relPath.split("/").forEach(function (part) {
      if (!part || part === ".") return;
      if (part === "..") stack.pop(); else stack.push(part);
    });
    return stack.join("/") + q;
  }

  function findCrypto() {
    if (window.DecryptionUtils && typeof window.DecryptionUtils.decryptPlaybackKey === "function") return window.DecryptionUtils;
    var names = Object.getOwnPropertyNames(window);
    for (var i = 0; i < names.length; i++) {
      try {
        var obj = window[names[i]];
        if (obj && typeof obj === "object" && typeof obj.decryptPlaybackKey === "function") return obj;
      } catch (e) {}
    }
    return null;
  }

  function loadPlayerScript() {
    return new Promise(function (resolve, reject) {
      if (findCrypto()) return resolve(findCrypto());
      var existing = document.querySelector('script[src*="player.stream-weave.com"]');
      if (existing) {
        var tries = 0; var t = setInterval(function () {
          var c = findCrypto(); if (c) { clearInterval(t); resolve(c); }
          else if (++tries > 40) { clearInterval(t); reject(new Error("timeout crypto")); }
        }, 150);
        return;
      }
      var s = document.createElement("script");
      s.src = "https://player.stream-weave.com/assets/player.js?v=1.1.1";
      s.onload = function () {
        var tries = 0; var t = setInterval(function () {
          var c = findCrypto(); if (c) { clearInterval(t); resolve(c); }
          else if (++tries > 40) { clearInterval(t); reject(new Error("crypto not found")); }
        }, 150);
      };
      s.onerror = function () { reject(new Error("failed to load player.js")); };
      document.head.appendChild(s);
    });
  }

  function resolveMedia(uri, variantBasePath, streamToken, variantFileUrl) {
    if (/^(blob:|data:)/i.test(uri)) return uri;
    if (uri.indexOf("/api/stream") === 0 || uri.indexOf("/api/cdn") === 0) return location.origin + uri;
    if (/^https?:\/\//i.test(uri)) return location.origin + "/api/cdn?u=" + toB64url(uri);
    if (variantFileUrl) {
      try { return location.origin + "/api/cdn?u=" + toB64url(new URL(uri, variantFileUrl).href); } catch (e) {}
    }
    return location.origin + "/api/stream?path=" + encodeURIComponent(joinRel(variantBasePath || "", uri)) + "&t=" + encodeURIComponent(streamToken);
  }

  function rewritePlaylist(text, streamToken, keyBlobUrl, variantBasePath, variantFileUrl) {
    return text.split("\n").map(function (line) {
        var s = line.trim();
        if (!s) return line;
        if (s.charAt(0) === "#") {
          if (s.indexOf("#EXT-X-KEY:") === 0 && keyBlobUrl) {
            return s.replace(/URI="[^"]+"/, 'URI="' + keyBlobUrl + '"');
          }
          return s.replace(/URI="([^"]+)"/g, function (_m, uri) {
            return 'URI="' + resolveMedia(uri, variantBasePath, streamToken, variantFileUrl) + '"';
          });
        }
        return resolveMedia(s, variantBasePath, streamToken, variantFileUrl);
      }).join("\n");
  }

  async function loadContent() {
    try {
      loading.classList.remove('hide');
      const res = await fetch(API_BASE + '/api/lectures/' + lectureId + '/content');
      const data = await res.json();
      const videos = data.data?.videos || data.body?.data?.videos || data.body?.videos || data.videos || [];
      
      if (videos.length > 0) {
        renderList(videos);
        const currentVid = videos.find(v => String(v.id) === String(videoId)) || videos[0];
        if (currentVid) {
          $('pageTitle').textContent = currentVid.title || 'مشاهدة المحاضرة';
          playVideo(currentVid.id);
        }
      } else {
        throw new Error('لا توجد فيديوهات متاحة.');
      }
    } catch (err) { showError(err.message); }
  }

  async function playVideo(id) {
    try {
      loading.classList.remove('hide');
      errorBox.classList.remove('show');
      loadingText.textContent = "جاري فتح الجلسة...";
      stopPlayback();

      const res = await fetch(API_BASE + '/api/video/' + id + '/play', { method: 'POST' });
      const sessionRes = await res.json();
      if (!res.ok || sessionRes.success === false) throw new Error(sessionRes.message || 'فشل جلب الجلسة');

      const session = sessionRes.data || sessionRes.body || sessionRes;
      const streamToken = session.token;
      const swVideoId = session.video_id;
      const hbUrl = session.heartbeat_url;

      if (!streamToken || !swVideoId) throw new Error("الجلسة ناقصة (مفيش token أو video_id)");

      loadingText.textContent = "تحميل أدوات فك التشفير...";
      if (!cryptoUtils) cryptoUtils = await loadPlayerScript();

      loadingText.textContent = "جلب قائمة التشغيل...";
      var masterUrl = "/api/stream?path=" + encodeURIComponent("videos/" + swVideoId + "/stream/master.m3u8") + "&t=" + encodeURIComponent(streamToken);
      var masterRes = await fetch(masterUrl);
      if (!masterRes.ok) throw new Error("master.m3u8 → HTTP " + masterRes.status);
      var masterText = await masterRes.text();

      var variantRel = masterText.split("\n").map(l => l.trim()).find(l => l && l.charAt(0) !== "#");
      if (!variantRel) throw new Error("مفيش variant في الـ master");

      var variantUrl;
      var variantBasePath = "videos/" + swVideoId + "/stream/";
      var variantFileUrl = null;

      if (variantRel.indexOf("/api/stream") === 0 || variantRel.indexOf("/api/cdn") === 0) {
        variantUrl = variantRel;
        try {
          var vu = new URL(variantRel, location.origin);
          if (vu.pathname.indexOf("/api/stream") === 0 && vu.searchParams.get("path")) variantBasePath = vu.searchParams.get("path");
          if (vu.pathname.indexOf("/api/cdn") === 0 && vu.searchParams.get("u")) variantFileUrl = fromB64url(vu.searchParams.get("u"));
        } catch (e) {}
      } else if (variantRel.indexOf("http") === 0) {
        variantFileUrl = variantRel;
        variantUrl = "/api/cdn?u=" + toB64url(variantRel);
      } else {
        variantBasePath = "videos/" + swVideoId + "/stream/" + variantRel;
        variantUrl = "/api/stream?path=" + encodeURIComponent(variantBasePath) + "&t=" + encodeURIComponent(streamToken);
      }

      var variantRes = await fetch(variantUrl);
      if (!variantRes.ok) throw new Error("variant → HTTP " + variantRes.status);
      var variantText = await variantRes.text();

      loadingText.textContent = "فك المفتاح...";
      var keyLine = variantText.split("\n").find(l => l.indexOf("EXT-X-KEY") !== -1);
      var keyPath = "videos/" + swVideoId + "/key";
      var ivHex = null;

      if (keyLine) {
        var keyUriMatch = keyLine.match(/URI="([^"]+)"/);
        var ivMatch = keyLine.match(/IV=0x([0-9a-fA-F]+)/i);
        if (ivMatch) ivHex = ivMatch[1];
        if (keyUriMatch) {
          var uri = keyUriMatch[1];
          if (uri.indexOf("/api/stream") === 0 || uri.indexOf(location.origin + "/api/stream") === 0) {
            try {
              var u = new URL(uri, location.origin);
              var pth = u.searchParams.get("path");
              if (pth) keyPath = pth;
            } catch (e) {}
          } else if (uri.indexOf("http") !== 0 && uri.indexOf("/api/cdn") !== 0) {
            keyPath = uri.replace(/^\//, "").replace(/^api\/v1\//, "");
          }
        }
      }

      var keyUrl = "/api/stream?path=" + encodeURIComponent(keyPath) + "&t=" + encodeURIComponent(streamToken);
      var keyRes = await fetch(keyUrl);
      if (!keyRes.ok) throw new Error("key → HTTP " + keyRes.status);
      var wrappedKey = new Uint8Array(await keyRes.arrayBuffer());

      var keyResult = await cryptoUtils.decryptPlaybackKey(wrappedKey, swVideoId);
      var aesKey = keyResult && keyResult.key;
      if (!aesKey || aesKey.byteLength !== 16) throw new Error("المفتاح غير صالح");

      var keyBytes = aesKey instanceof ArrayBuffer ? aesKey : aesKey.buffer.slice(aesKey.byteOffset, aesKey.byteOffset + aesKey.byteLength);
      var keyBlob = new Blob([keyBytes], { type: "application/octet-stream" });
      currentKeyBlobUrl = URL.createObjectURL(keyBlob);

      var fixedVariant = rewritePlaylist(variantText, streamToken, currentKeyBlobUrl, variantBasePath, variantFileUrl);
      if (fixedVariant.indexOf("#EXTM3U") !== 0) fixedVariant = "#EXTM3U\n" + fixedVariant.replace(/^#EXTM3U\s*/m, "");
      if (fixedVariant.indexOf("EXT-X-KEY") === -1) {
        var ivPart = ivHex ? ",IV=0x" + ivHex : "";
        fixedVariant = '#EXTM3U\n#EXT-X-KEY:METHOD=AES-128,URI="' + currentKeyBlobUrl + '"' + ivPart + "\n" + fixedVariant.replace(/^#EXTM3U\s*/m, "");
      }

      var playlistBlob = new Blob([fixedVariant], { type: "application/vnd.apple.mpegurl" });
      currentPlaylistBlobUrl = URL.createObjectURL(playlistBlob);

      loadingText.textContent = "جاري التشغيل...";

      hbTimer = setInterval(function () {
        fetch("/api/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: hbUrl, token: streamToken }),
        }).catch(function () {});
      }, 25000);

      if (window.Hls && Hls.isSupported()) {
        hls = new Hls({ enableWorker: false, maxBufferLength: 30, maxMaxBufferLength: 60 });
        hls.loadSource(currentPlaylistBlobUrl);
        hls.attachMedia(videoEl);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          loading.classList.add('hide');
          videoEl.play().catch(function () { loadingText.textContent = "اضغط Play يدويًا"; });
        });

        hls.on(Hls.Events.ERROR, function (_, data) {
          if (!data.fatal) return;
          var msg = data.type + (data.details ? " / " + data.details : "");
          if (data.response && data.response.code) msg += " HTTP " + data.response.code;
          showError("خطأ HLS: " + msg);
        });
      } else {
        showError("المتصفح لا يدعم HLS.js");
      }

    } catch (e) {
      console.error(e);
      showError("فشل: " + (e.message || e));
    }
  }

  function stopPlayback() {
    if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
    if (hls) { hls.destroy(); hls = null; }
    if (currentKeyBlobUrl) { URL.revokeObjectURL(currentKeyBlobUrl); currentKeyBlobUrl = null; }
    if (currentPlaylistBlobUrl) { URL.revokeObjectURL(currentPlaylistBlobUrl); currentPlaylistBlobUrl = null; }
    if (videoEl) { videoEl.removeAttribute("src"); videoEl.load(); }
  }

  function renderList(videos) {
    const list = $('videosList');
    list.innerHTML = '';
    videos.forEach(v => {
      const el = document.createElement('div');
      el.className = 'item' + (String(v.id) === String(videoId) ? ' active' : '');
      el.innerHTML = `<div class="itemtitle">${v.title}</div>`;
      el.onclick = () => {
        $('pageTitle').textContent = v.title;
        document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        playVideo(v.id);
      };
      list.appendChild(el);
    });
  }

  if (lectureId && videoId) {
    loadContent();
  } else {
    showError('معرف المحاضرة أو الفيديو غير موجود.');
  }
})();
</script>
</body>
</html>
