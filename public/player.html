<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مشغل المحاضرة | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#080d18;color:#f3f6ff;font-family:Cairo,sans-serif;display:flex;flex-direction:column;height:100vh}
.topbar{padding:12px 20px;background:#111a2a;border-bottom:1px solid #26344b;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:900;font-size:18px}
.back-btn{color:#fff;text-decoration:none;background:#ffffff1a;padding:8px 16px;border-radius:8px;font-size:14px}
.player-container{flex:1;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
video{width:100%;height:100%;max-height:calc(100vh - 120px);outline:none}
.loading{position:absolute;color:#fff;font-size:16px;font-weight:bold}
.loading.hidden{display:none}
.error{position:absolute;color:#f87171;font-size:16px;font-weight:bold;text-align:center;padding:20px;background:#0009;border-radius:10px}
.error.hidden{display:none}
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">ثانوية club</div>
    <a href="subjects.html" class="back-btn">رجوع للمحتوى</a>
</div>

<div class="player-container">
    <div class="loading" id="loading">جاري تحميل الفيديو...</div>
    <div class="error hidden" id="error"></div>
    <video id="video" controls autoplay></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(async function() {
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('videoId');
    const loadingEl = document.getElementById('loading');
    const errorEl = document.getElementById('error');
    const video = document.getElementById('video');

    if (!videoId) {
        loadingEl.classList.add('hidden');
        errorEl.textContent = 'رقم الفيديو غير موجود في الرابط';
        errorEl.classList.remove('hidden');
        return;
    }

    try {
        // بنطلب من السيرفر بتاعنا يجيب الفيديو ويفك تشفيره
        const proxyUrl = '/api/video-proxy/' + videoId;

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(proxyUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                loadingEl.classList.add('hidden');
                video.play().catch(e => {
                    // المتصفح رفض التشغيل التلقائي
                });
            });
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    loadingEl.classList.add('hidden');
                    errorEl.textContent = 'حدث خطأ أثناء تشغيل الفيديو. جرب إعادة تحميل الصفحة.';
                    errorEl.classList.remove('hidden');
                    console.error(data);
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = proxyUrl;
            video.addEventListener('loadedmetadata', function() {
                loadingEl.classList.add('hidden');
                video.play().catch(e => {});
            });
        } else {
            throw new Error('متصفحك لا يدعم تشغيل الفيديو');
        }
    } catch (err) {
        loadingEl.classList.add('hidden');
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
    }
})();
</script>
</body>
</html>
