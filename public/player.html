<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل المحاضرة</title>
    <!-- مكتبة HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <style>
        body { margin:0; background:#000; font-family: Arial, sans-serif; overflow: hidden; }
        #video-container { position: relative; width: 100%; height: 100vh; }
        #video { width: 100%; height: 100%; object-fit: contain; }
        .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 20px; border-radius: 10px; display: flex; align-items: center; gap: 15px; }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay playsinline controls></video>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls;

        // دالة لتحميل سكريبت stream-weave اللي فيه أدوات فك التشفير
        function loadSWPlayer() {
            return new Promise((resolve, reject) => {
                if (window.DecryptionUtils) return resolve(window.DecryptionUtils);
                
                const script = document.createElement('script');
                script.src = "https://player.stream-weave.com/assets/player.js?v=1.1.1";
                script.onload = () => {
                    if (window.DecryptionUtils) resolve(window.DecryptionUtils);
                    else reject(new Error("DecryptionUtils not found in player.js"));
                };
                script.onerror = () => reject(new Error("Failed to load player.js"));
                document.head.appendChild(script);
            });
        }

        async function playVideo(lectureId, videoId) {
            try {
                // 1. جلب بيانات الجلسة من السيرفر بتاعك
                const sessionRes = await fetch(`/api/video/${lectureId}/session`);
                if (!sessionRes.ok) throw new Error("فشل الاتصال بالسيرفر");
                const session = await sessionRes.json();
                
                const { token, stream_url, video_id } = session;

                // تجهيز رابط الـ Proxy الخاص بالسيرفر بتاعك
                const urlObj = new URL(stream_url);
                const path = urlObj.pathname.replace('/api/v1/', '');
                const proxyUrl = `/api/stream?path=${encodeURIComponent(path)}&t=${token}`;

                // 2. تحميل أدوات فك التشفير
                const crypto = await loadSWPlayer();

                // 3. تشغيل HLS.js مع ميزة فك تشفير المفتاح
                if (Hls.isSupported()) {
                    hls = new Hls({
                        // هنا بنعترض طلب المفتاح ونفك تشفيره قبل ما HLS يستلمه
                        keyLoader: function(keyInfo, keyXhr, resp) {
                            // keyInfo.url هيكون رابط الـ Proxy بتاعنا
                            fetch(keyInfo.url)
                                .then(r => {
                                    if (!r.ok) throw new Error("Key fetch failed: " + r.status);
                                    return r.arrayBuffer();
                                })
                                .then(async buffer => {
                                    // فك تشفير المفتاح باستخدام دالة stream-weave
                                    const result = await crypto.decryptPlaybackKey(new Uint8Array(buffer), video_id);
                                    
                                    if (result && result.key) {
                                        // نرجع المفتاح مفكوك لـ HLS.js (لازم يكون ArrayBuffer بحجم 16 بايت)
                                        resp.data = result.key.buffer; 
                                        keyLoader(keyInfo, resp); // Success callback
                                        console.log('🔑 تم فك تشفير المفتاح بنجاح');
                                    } else {
                                        keyLoader(keyInfo, resp, new Error("فشل فك تشفير المفتاح"));
                                    }
                                })
                                .catch(err => keyLoader(keyInfo, resp, err));
                        }
                    });

                    hls.loadSource(proxyUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.error("Auto-play prevented:", e));
                        console.log('✅ الفيديو شغال');
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.error('HLS Error:', data);
                        if (data.fatal) {
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    hls.startLoad();
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    // دعم سفاري (ممكن يحتاج تعديل لو التشفير معقد)
                    video.src = proxyUrl;
                }
            } catch (e) {
                console.error("Playback Error:", e);
                alert("خطأ في التشغيل: " + e.message);
            }
        }

        // استخراج الـ Parameters من الرابط
        const params = new URLSearchParams(window.location.search);
        const lectureId = params.get('lecturedId') || params.get('lectureId');
        const videoId = params.get('videold') || params.get('videoId');

        if (lectureId && videoId) {
            playVideo(lectureId, videoId);
        } else {
            console.error('❌ مفيش lectureId أو videoId في الرابط');
        }
    </script>
</body>
</html>
