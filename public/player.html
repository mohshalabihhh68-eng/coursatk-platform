<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل المحاضرة</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <style>
        body { margin:0; background:#000; font-family: Arial, sans-serif; overflow: hidden; }
        #video-container { position: relative; width: 100%; height: 100vh; }
        #video { width: 100%; height: 100%; object-fit: contain; }
        .error-box { color: #fff; text-align: center; padding: 50px; font-size: 18px; }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay playsinline controls></video>
    </div>

    <!-- الكود كله لازم يكون جوه السكريبت ده -->
    <script>
        const video = document.getElementById('video');
        let hls;

        // دالة تحميل أدوات فك التشفير
        function loadSWPlayer() {
            return new Promise((resolve, reject) => {
                if (window.DecryptionUtils) return resolve(window.DecryptionUtils);
                const script = document.createElement('script');
                script.src = "https://player.stream-weave.com/assets/player.js?v=1.1.1";
                script.onload = () => {
                    if (window.DecryptionUtils) resolve(window.DecryptionUtils);
                    else reject(new Error("DecryptionUtils not found"));
                };
                script.onerror = () => reject(new Error("Failed to load player.js"));
                document.head.appendChild(script);
            });
        }

        async function playVideo(lectureId, videoId) {
            try {
                // 1. طلب البيانات من السيرفر
                const res = await fetch(`/api/video/${lectureId}/session`);
                
                // لو السيرفر رجع صفحة HTML بدل JSON (زي اللي حصل في الصورة)
                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("السيرفر رجع صفحة HTML بدل البيانات. تأكد من رفع ملف server.js الجديد.");
                }

                if (!res.ok) throw new Error("فشل جلب بيانات الجلسة من السيرفر");

                const session = await res.json();
                const { token, stream_url, video_id } = session;

                const urlObj = new URL(stream_url);
                const path = urlObj.pathname.replace('/api/v1/', '');
                const proxyUrl = `/api/stream?path=${encodeURIComponent(path)}&t=${token}`;

                // 2. تحميل أدوات فك التشفير
                const crypto = await loadSWPlayer();

                // 3. تشغيل HLS
                if (Hls.isSupported()) {
                    hls = new Hls({
                        keyLoader: function(keyInfo, keyXhr, resp) {
                            fetch(keyInfo.url)
                                .then(r => r.arrayBuffer())
                                .then(async buffer => {
                                    const result = await crypto.decryptPlaybackKey(new Uint8Array(buffer), video_id);
                                    if (result && result.key) {
                                        resp.data = result.key.buffer; 
                                        keyLoader(keyInfo, resp);
                                    } else {
                                        keyLoader(keyInfo, resp, new Error("فشل فك التشفير"));
                                    }
                                })
                                .catch(err => keyLoader(keyInfo, resp, err));
                        }
                    });

                    hls.loadSource(proxyUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                } else {
                    video.src = proxyUrl;
                }
            } catch (e) {
                console.error(e);
                document.body.innerHTML = `<div class="error-box">❌ خطأ: ${e.message}</div>`;
            }
        }

        const params = new URLSearchParams(window.location.search);
        const lectureId = params.get('lecturedId') || params.get('lectureId');
        const videoId = params.get('videold') || params.get('videoId');

        if (lectureId && videoId) {
            playVideo(lectureId, videoId);
        } else {
            document.body.innerHTML = '<div class="error-box">❌ مفيش بيانات في الرابط</div>';
        }
    </script>
</body>
</html>
