<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المشغل | كورساتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
<style>
.player-page {
  display: flex;
  min-height: 100vh;
  flex-direction: row;
}
.player-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 24px;
  gap: 20px;
}
.player-header {
  display: flex;
  align-items: center;
  gap: 16px;
}
.back-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-primary);
  font-weight: 800;
  font-size: 0.9rem;
  transition: var(--transition);
  cursor: pointer;
}
.back-btn:hover { border-color: var(--orange); color: var(--orange-light); }

.video-wrapper {
  position: relative;
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  aspect-ratio: 16/9;
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}
.video-wrapper video {
  width: 100%;
  height: 100%;
  display: block;
  background: #000;
}

.video-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.8);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: white;
  text-align: center;
  padding: 20px;
  z-index: 10;
}
.video-overlay.hidden { display: none; }
.video-overlay .spinner {
  width: 48px;
  height: 48px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: rgba(30, 15, 15, 0.95);
  border: 1px solid rgba(239, 68, 68, 0.5);
  border-radius: var(--radius-lg);
  padding: 32px;
  max-width: 400px;
}
.error-box button {
  margin-top: 16px;
  padding: 12px 24px;
  background: var(--orange);
  color: white;
  border-radius: 12px;
  font-weight: 800;
}

.video-info {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.video-title {
  font-size: 1.3rem;
  font-weight: 900;
  line-height: 1.4;
}
.video-meta {
  display: flex;
  gap: 12px;
  align-items: center;
  color: var(--text-muted);
  font-size: 0.9rem;
  flex-wrap: wrap;
}
.meta-badge {
  padding: 4px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-weight: 700;
}
.controls-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.ctrl-btn {
  padding: 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}
.ctrl-btn:hover { border-color: var(--orange); color: var(--orange-light); }
.speed-select {
  padding: 10px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-primary);
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
}

/* Playlist sidebar */
.playlist {
  width: 360px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  max-height: 100vh;
  overflow-y: auto;
}
.playlist-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg-card);
  z-index: 5;
}
.playlist-header h3 { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; }
.playlist-header p { font-size: 0.85rem; color: var(--text-muted); }
.playlist-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.playlist-item {
  display: flex;
  gap: 12px;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
}
.playlist-item:hover { background: rgba(255, 255, 255, 0.04); }
.playlist-item.active {
  background: rgba(255, 107, 26, 0.1);
  border-color: rgba(255, 107, 26, 0.4);
}
.playlist-item.done .playlist-num { background: var(--mint); color: white; }
.playlist-num {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 900;
  flex-shrink: 0;
}
.playlist-item.active .playlist-num { background: var(--orange); color: white; }
.playlist-info { flex: 1; min-width: 0; }
.playlist-title {
  font-size: 0.9rem;
  font-weight: 800;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.playlist-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; font-weight: 600; }

@media (max-width: 900px) {
  .player-page { flex-direction: column; }
  .player-main { padding: 12px; }
  .playlist { width: 100%; max-height: 400px; border-right: none; border-top: 1px solid var(--border); }
}
</style>
</head>
<body>

<div class="player-page">
  <div class="player-main">
    <div class="player-header">
      <button class="back-btn" onclick="history.back()">
        ← رجوع
      </button>
    </div>
    
    <div class="video-wrapper">
      <video id="video" controls playsinline webkit-playsinline preload="auto"></video>
      <div class="video-overlay" id="overlay">
        <div class="spinner"></div>
        <p>جاري تجهيز الفيديو...</p>
      </div>
      <div class="video-overlay hidden" id="errorOverlay">
        <div class="error-box">
          <div style="font-size:2.5rem; margin-bottom:12px;">⚠️</div>
          <h3 style="margin-bottom:8px;">فشل تشغيل الفيديو</h3>
          <p id="errorText" style="color:var(--text-muted); font-size:0.9rem; line-height:1.6;"></p>
          <button onclick="location.reload()">إعادة المحاولة</button>
        </div>
      </div>
    </div>
    
    <div class="video-info">
      <h2 class="video-title" id="videoTitle">جاري التحميل...</h2>
      <div class="video-meta">
        <span class="meta-badge" id="lectureName">—</span>
        <span class="meta-badge" id="saveStatus"></span>
      </div>
    </div>
    
    <div class="controls-row">
      <button class="ctrl-btn" onclick="skip(-10)">⏪ -10s</button>
      <button class="ctrl-btn" onclick="skip(10)">+10s ⏩</button>
      <select class="speed-select" id="speedSelect" onchange="changeSpeed(this.value)">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="1.75">1.75×</option>
        <option value="2">2×</option>
      </select>
    </div>
  </div>
  
  <aside class="playlist">
    <div class="playlist-header">
      <h3>📺 محتويات المحاضرة</h3>
      <p id="playlistSub">— فيديو</p>
    </div>
    <div class="playlist-body" id="playlistBody">
      <div style="padding:20px; text-align:center; color:var(--text-muted);">جاري التحميل...</div>
    </div>
  </aside>
</div>

<script src="player.js"></script>

</body>
</html>
