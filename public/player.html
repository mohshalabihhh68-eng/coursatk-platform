<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>المشغل | كورساتك</title>
<link rel="stylesheet" href="styles.css" />
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="player-page" class="show">
  <div class="player-header-nav">
    <button class="back-btn" onclick="location.href='subjects.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="m15 18-6-6 6-6"/></svg>
      رجوع
    </button>
    <div class="brand-mini">
      <div class="brand-text"><h1>كورساتك</h1><p>مشغل المحاضرات</p></div>
    </div>
  </div>

  <div class="player-layout">
    <div class="player-main-col">
      <div class="video-frame">
        <div class="custom-player-container" id="custom-player">
          <video id="video" playsinline></video>
          <div class="click-layer" id="click-layer"></div>

          <button class="big-play" id="bigPlay">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>

          <div class="loader" id="loader"></div>

          <div class="controls-bar" id="controls-bar">
            <div class="progress-container" id="progressBar">
              <div class="progress-filled" id="progressFilled"></div>
            </div>

            <div class="controls-row">
              <div class="controls-left">
                <button class="ctrl-btn" id="playBtn">
                  <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <div class="volume-container">
                  <button class="ctrl-btn" id="muteBtn">
                    <svg id="volumeIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                  </button>
                  <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                </div>
                <span class="time-display" id="time-display">0:00 / 0:00</span>
              </div>
              <div class="controls-right">
                <button class="ctrl-btn" id="fullscreenBtn">
                  <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="video-details">
        <div class="details-header">
          <h2 id="video-title">محتوي المحاضرة</h2>
        </div>
      </div>
    </div>

    <div class="player-side-col">
      <div class="side-header">
        <div class="side-title">
          <h3>محتوي المحاضرة</h3>
        </div>
      </div>
      <div class="side-list" id="side-videos-list"></div>
    </div>
  </div>
</div>

<script src="player.js"></script>
</body>
</html>
