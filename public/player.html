<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشغل الفيديو | كورساتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
<style>
body { margin: 0; padding: 0; overflow-x: hidden; }
.player-layout { display: flex; min-height: 100vh; gap: 0; }
.player-main { flex: 1; padding: 20px; display: flex; flex-direction: column; }
.video-frame {
  position: relative; background: #000; border-radius: 16px;
  overflow: hidden; aspect-ratio: 16/9;
  border: 1px solid var(--line);
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.video-frame video {
  width: 100%; height: 100%; display: block; background: #000;
}
.player-controls {
  display: flex; gap: 10px; padding: 14px 0; flex-wrap: wrap;
  align-items: center;
}
.player-controls button, .player-controls select {
  background: var(--panel); border: 1px solid var(--line);
  color: var(--text); padding: 10px 16px; border-radius: 10px;
  cursor: pointer; font-weight: 800; font-family: inherit;
  transition: .2s; font-size: 0.9rem;
}
.player-controls button:hover, .player-controls select:hover {
  border-color: var(--orange); color: var(--orange2);
}
.video-title {
  font-size: 1.3rem; font-weight: 900; margin-bottom: 16px;
  padding: 0 4px;
}
.video-title small { color: var(--muted); font-size: 0.85rem; font-weight: 700; display: block; margin-top: 4px; }
.playlist {
  width: 340px; background: var(--panel); border-left: 1px solid var(--line);
  max-height: 100vh; overflow-y: auto; padding: 20px; flex-shrink: 0;
}
.playlist h3 { font-size: 1.1rem; margin-bottom: 16px; font-weight: 900; }
.playlist-item {
  display: flex; gap: 12px; padding: 12px; border-radius: 12px;
  margin-bottom: 8px; cursor: pointer; transition: .2s;
  border: 1px solid transparent;
}
.playlist-item:hover { background: rgba(255,255,255,.04); }
.playlist-item.active {
  background: rgba(255,107,26,.1); border-color: rgba(255,107,26,.4);
}
.playlist-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,.08); color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 800; flex-shrink: 0;
}
.playlist-item.active .playlist-num { background: var(--orange); color: #fff; }
.playlist-item.done .playlist-num { background: var(--mint); color: #fff; }
.playlist-info { flex: 1; min-width: 0; }
.playlist-title {
  font-size: 0.9rem; font-weight: 800; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.playlist-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

/* Loading and Error overlays */
.video-overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.7); color: #fff; text-align: center;
  padding: 20px; z-index: 5;
}
.video-overlay.hidden { display: none; }
.video-overlay .spinner {
  width: 48px; height: 48px; border: 3px solid rgba(255,255,255,.2);
  border-top-color: var(--orange); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: rgba(20,10,10,.9); border: 1px solid rgba(239,68,68,.5);
  border-radius: 16px; padding: 24px; max-width: 400px;
}
.error-box button {
  margin-top: 12px; padding: 10px 20px;
  background: var(--orange); border: none; color: #fff;
  border-radius: 10px; cursor: pointer; font-weight: 800;
}

@media (max-width: 900px) {
  .player-layout { flex-direction: column; }
  .playlist { width: 100%; max-height: 400px; border-left: none; border-top: 1px solid var(--line); }
  .player-main { padding: 12px; }
}
</style>
</head>
<body>

<div class="player-layout">
  <div class="player-main">
    <div class="video-title">
      <span id="videoTitle">جاري التحميل...</span>
      <small id="lectureName"></small>
    </div>
    <div class="video-frame">
      <video id="video" controls playsinline webkit-playsinline preload="auto"></video>
      <div class="video-overlay" id="overlay">
        <div style="text-align:center;">
          <div class="spinner"></div>
          جاري تجهيز الفيديو...
        </div>
      </div>
      <div class="video-overlay hidden" id="errorOverlay">
        <div class="error-box">
          <div style="font-size:2rem; margin-bottom:12px;">⚠️</div>
          <b>فشل تشغيل الفيديو</b>
          <p style="color: var(--muted); margin-top:8px; font-size:0.9rem;" id="errorText"></p>
          <button onclick="location.reload()">إعادة تحميل الصفحة</button>
        </div>
      </div>
    </div>
    <div class="player-controls">
      <button onclick="location.href='subjects.html'">← رجوع للمواد</button>
      <button onclick="window.history.back()">← المحاضرات</button>
      <button onclick="skip(-10)">⏪ -10s</button>
      <button onclick="skip(10)">+10s ⏩</button>
      <select id="speedSelect" onchange="changeSpeed(this.value)">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="1.75">1.75x</option>
        <option value="2">2x</option>
      </select>
      <span style="color: var(--muted); font-size: 0.85rem; margin-right: auto;" id="saveStatus"></span>
    </div>
  </div>
  
  <aside class="playlist">
    <h3>📺 محتويات المحاضرة</h3>
    <div id="playlist"></div>
  </aside>
</div>

<script src="player.js"></script>

</body>
</html>
