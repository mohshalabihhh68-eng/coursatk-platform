<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الفصول | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.12);--blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}
button{font:inherit;cursor:pointer; outline: none;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Navbar */
.app-nav{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer}
.brand img{width:36px;height:36px;border-radius:11px}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.profile-wrap{position:relative;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:800;font-size:12px;color:var(--ink)}
.profile-btn .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}

/* Content */
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg, var(--blue), var(--blue3));color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:24px;transition:all .2s ease;box-shadow: 0 4px 12px rgba(37,99,235,.3);}
.back-btn:hover{transform:translateX(4px);box-shadow: 0 6px 16px rgba(37,99,235,.5);filter:brightness(1.1);}
.back-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2.5;fill:none;}

.page-head{margin-bottom:22px;animation:fadeUp .4s ease}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.12);color:var(--blue2);border:1px solid rgba(59,130,246,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.page-head h1{margin:0;font-size:26px;font-weight:900}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:13px}

/* Grid & Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  transition:.3s;
  animation:fadeUp .45s ease both;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  display: flex;
  flex-direction: column;
  cursor: default; /* الكارت مش زرار */
}
.card:hover{transform:translateY(-8px);border-color:rgba(59,130,246,.4);box-shadow:0 24px 50px rgba(37,99,235,.18)}

/* الصورة والجزء العلوي مش بيتأثروا بالضغط */
.card-img{
  position:relative;
  aspect-ratio:16/9;
  background:#101b31;
  overflow:hidden;
  pointer-events: none; /* مفيش أي أكشن لما تدوس */
}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted)}

.card-body{padding:16px;display:flex;flex-direction:column;min-height:130px;flex:1}
.card-body h3{margin:0;font-size:16px;font-weight:900}
.card-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted);font-weight:700;margin-bottom: 16px}

/* الزرار اللي بيفتح الصفحة */
.card-btn{
  width:100%;
  padding:11px;
  border:0;
  border-radius:12px;
  font-weight:900;
  font-size:12px;
  background:linear-gradient(135deg,var(--blue),var(--blue3));
  color:#fff;
  cursor:pointer;
  margin-top:auto;
  transition: all .2s ease;
}
.card-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(37,99,235,.4); filter: brightness(1.1); }

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}

@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <header class="app-nav"><div class="app-nav-in">
    <div class="brand" id="brand-home"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M32 14 8 26l24 12 24-12z' fill='%23fff'/%3E%3C/svg%3E" alt=""><div>ثانوية club<small>منصة الثانوية العامة</small></div></div>
    <div class="profile-wrap"><button type="button" class="profile-btn" id="profile-btn"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button></div>
  </div></header>

  <main class="wrap" id="main">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      رجوع
    </button>
    <div class="loading"><div class="spinner"></div><p>جاري تحميل الفصول...</p></div>
  </main>

<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'cstk_tok', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const teacherId = qs.get('teacherId');
const teacherName = qs.get('teacherName') || '';
const subjectName = qs.get('subjectName') || '';

const api = async (path, opts = {}) => {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
  return data.data;
};
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function load() {
  if (!teacherId) { $('main').innerHTML = '<div style="text-align:center;padding:50px">معرف المدرس غير موجود.</div>'; return; }
  try {
    const chapters = await api('/api/teachers/' + teacherId + '/chapters');
    if (!chapters || !chapters.length) { $('main').innerHTML = '<div style="text-align:center;padding:50px;color:var(--muted)">لا يوجد فصول متاحة.</div>'; return; }
    
    let html = `
    <div class="page-head">
      <div class="badge">الفصول</div>
      <h1>الفصول المتاحة</h1>
      <p>اختار الفصل لعرض المحاضرات</p>
    </div>
    <div class="grid">`;
    
    chapters.forEach(c => {
      // التعديل هنا: الـ onclick اتنقل للزرار، والكارت بقى مجرد شكل
      html += `<div class="card">
        <div class="card-img">
          ${c.image_url ? `<img src="${esc(c.image_url)}" alt="${esc(c.name)}" onerror="this.style.display='none'">` : ''}
          <div class="ph" style="display:${c.image_url ? 'none' : 'grid'}"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        </div>
        <div class="card-body">
          <h3>${esc(c.name)}</h3>
          <div class="card-meta"><span>${c.lecture_count || 0} محاضرة</span></div>
          <button class="card-btn" onclick="window.location.href='lectures.html?chapterId=${c.id}&chapterName=${encodeURIComponent(c.name)}&teacherName=${encodeURIComponent(teacherName)}&subjectName=${encodeURIComponent(subjectName)}'">
            عرض المحاضرات ←
          </button>
        </div>
      </div>`;
    });
    html += '</div>'; $('main').innerHTML = html;
  } catch (e) { $('main').innerHTML = `<div style="text-align:center;color:#ff5252;padding:50px;">خطأ: ${e.message}</div>`; }
}

async function loadProfile() { try { const me = await api('/api/profile'); $('nav-name').textContent = me.name || 'طالب'; $('nav-av').textContent = (me.name || 'ط').charAt(0); } catch (e) {} }
$('brand-home').onclick = () => window.location.href = 'index.html';
load(); loadProfile();
})();
</script>
</body>
</html>
