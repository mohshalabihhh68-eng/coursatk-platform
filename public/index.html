<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>كورساتك</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
</head>
<body>
  <header class="header">
    <div class="user-area">
      <div class="user-chip">
        <div class="avatar">ش</div>
        <span>أهلاً شلبي</span>
      </div>
    </div>
    <div class="logo-area">
      <div>
        <div class="brand">كورساتك</div>
        <div class="sub">هتذاكر بطعم الضحك</div>
      </div>
    </div>
  </header>

  <div id="app">
    <div class="loading">جاري التحميل...</div>
  </div>

  <!-- Player Modal -->
  <div id="player-modal" class="modal hidden">
    <div class="player-container">
      <div class="player-header">
        <button class="close-btn" onclick="closePlayer()">×</button>
        <h3 id="player-title"></h3>
      </div>
      <div class="video-wrapper">
        <video id="video" playsinline controls></video>
        <div id="player-status" class="status"></div>
      </div>
      <div class="player-controls">
        <div class="control-group">
          <label>السرعة</label>
          <div class="speed-btns" id="speed-btns">
            <button data-speed="0.5">0.5x</button>
            <button data-speed="0.75">0.75x</button>
            <button data-speed="1" class="active">1x</button>
            <button data-speed="1.25">1.25x</button>
            <button data-speed="1.5">1.5x</button>
            <button data-speed="1.75">1.75x</button>
            <button data-speed="2">2x</button>
          </div>
        </div>
        <div class="control-group">
          <label>الجودة</label>
          <select id="quality-select">
            <option value="-1">تلقائي</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
