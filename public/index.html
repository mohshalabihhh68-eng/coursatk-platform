<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>ثانوية World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23f97316'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>W</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
</head>
<body>
  <header class="topbar">
    <div class="logo" onclick="goHome()" role="button" tabindex="0">
      <span class="logo-mark">W</span>
      <span class="logo-text">ثانوية World</span>
    </div>

    <div class="header-actions">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input id="search-input" type="search" placeholder="ابحث..." aria-label="بحث" />
      </div>

      <button id="theme-toggle" class="icon-btn" aria-label="تبديل الثيم" title="تبديل الثيم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>

      <div id="profile-chip" class="chip hidden"></div>
    </div>
  </header>

  <main id="app">
    <div class="skeleton-grid" aria-hidden="true">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </main>

  <div id="player-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="player-container">
      <div class="player-header">
        <h3 id="player-title"></h3>
        <button class="close-btn" onclick="closePlayer()" aria-label="إغلاق">✕</button>
      </div>
      <div class="video-wrapper">
        <video id="video" controls playsinline></video>
        <div id="player-status" class="status hidden"></div>
      </div>
      <div class="player-controls">
        <div class="control-group">
          <label>السرعة</label>
          <div class="speed-btns" id="speed-btns">
            <button data-speed="0.5">0.5×</button>
            <button data-speed="0.75">0.75×</button>
            <button data-speed="1" class="active">1×</button>
            <button data-speed="1.25">1.25×</button>
            <button data-speed="1.5">1.5×</button>
            <button data-speed="2">2×</button>
          </div>
        </div>
        <div class="control-group">
          <label>الجودة</label>
          <select id="quality-select"><option>تلقائي</option></select>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
