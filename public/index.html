<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>المواد الدراسية | كورساتك</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- الهيدر -->
  <header class="nav">
    <div class="container navin">
      <a class="brand" href="index.html">
        <span class="logo">📚</span>
        <span>كورساتك<small>منصة تعليمية</small></span>
      </a>
      <div class="navactions">
        <button class="btn btn-soft" onclick="goProfile()">حسابي</button>
        <button class="btn btn-primary" onclick="logout()">خروج</button>
      </div>
    </div>
  </header>

  <!-- محتوى الصفحة -->
  <main id="app" class="container" style="padding-top: 30px; padding-bottom: 60px;">
    <div style="text-align:center; padding:60px; color:var(--muted);">
      جاري التحميل...
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // دالة البروفايل
    function goProfile() {
      window.location.href = 'profile.html';
    }
    // دالة الخروج
    function logout() {
      localStorage.removeItem('cstk_tok');
      window.location.href = 'index.html';
    }
    // لو المستخدم مش مسجل دخول، نرجعه للصفحة الرئيسية
    if (!localStorage.getItem('cstk_tok')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
