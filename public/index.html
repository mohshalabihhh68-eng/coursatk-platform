<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>دخول — ثانوية World</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .login-box h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-box p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 28px;
    }
    .login-box input {
      width: 100%;
      padding: 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 8px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
      margin-bottom: 16px;
    }
    .login-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .login-box button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--accent-glow);
    }
    .login-box button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }
    .login-status {
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }
    .login-status.show { display: block; }
    .login-status.loading {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
    }
    .login-status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .login-status.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .login-hint {
      margin-top: 20px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <h1>ثانوية World</h1>
      <p>اكتب كود الاشتراك للدخول</p>
      <form id="login-form">
        <input id="code-input" type="text" inputmode="numeric" maxlength="7" placeholder="0000000" autocomplete="one-time-code" required />
        <button type="submit" id="login-btn">دخول</button>
        <div class="login-status" id="login-status"></div>
      </form>
      <div class="login-hint">الكود مكوّن من 7 أرقام</div>
    </div>
  </div>

  <script>
    (function () {
      try {
        if (localStorage.getItem("cstk_tok")) {
          window.location.href = "/subjects.html";
          return;
        }
      } catch (e) {}

      var form = document.getElementById("login-form");
      var input = document.getElementById("code-input");
      var btn = document.getElementById("login-btn");
      var status = document.getElementById("login-status");

      input.addEventListener("input", function () {
        input.value = input.value.replace(/\D/g, "").slice(0, 7);
      });

      function show(type, text) {
        status.className = "login-status show " + type;
        status.textContent = text;
      }

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var code = input.value.trim();
        if (!/^\d{7}$/.test(code)) {
          show("error", "اكتب 7 أرقام");
          return;
        }
        btn.disabled = true;
        show("loading", "جاري الدخول...");

        var token = "bypass_" + code + "_" + Date.now();
        try {
          localStorage.setItem("cstk_tok", token);
          localStorage.setItem("cstk_code", code);
          localStorage.setItem("cstk_me", JSON.stringify({ name: "طالب", code: code }));
        } catch (err) {
          show("error", "المتصفح مش بيسمح بتخزين الجلسة");
          btn.disabled = false;
          return;
        }

        show("success", "تمام! جاري فتح المواد...");
        setTimeout(function () {
          window.location.href = "/subjects.html";
        }, 400);
      });
    })();
  </script>
</body>
</html>
