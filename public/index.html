<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>كورساتك - منصة تعليمية</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

  <header class="topbar">
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
    <div class="topbar-left" onclick="goHome()" style="cursor:pointer">
      <div class="brand-text">
        <h1>كورساتك</h1>
        <p>هنذاكر بطعم الضحك</p>
      </div>
      <div class="brand-logo">C</div>
    </div>
  </header>

  <main id="app"><div class="loading">جاري التحميل...</div></main>

  <!-- شاشة المشاهدة -->
  <div id="player-page" class="player-page hidden">
    
    <div class="player-header-nav">
      <button class="back-btn" onclick="closePlayer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg> رجوع
      </button>
      <div class="brand-mini">
        <div class="brand-text"><h1>كورساتك</h1><p>مشغل المحاضرات</p></div>
        <div class="brand-logo">C</div>
      </div>
    </div>

    <div class="player-layout">
      
      <!-- الفيديو (يمين) -->
      <div class="player-main-col">
        
        <!-- إطار الفيديو -->
        <div class="video-frame">
          <!-- حاوية الفيديو -->
          <div class="custom-player-container" id="custom-player">
            <video id="video" playsinline></video>
            <div class="click-layer" id="click-layer"></div>

            <div id="player-status" class="player-status hidden">
              <div class="spinner"></div>
            </div>

            <!-- زر التشغيل / الإعادة -->
            <div id="center-play-btn" class="center-play-btn hidden" onclick="togglePlay()">
              <svg id="center-play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg id="center-replay-icon" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </div>

            <div id="seek-indicator" class="seek-indicator hidden"></div>

            <!-- شريط التحكم -->
            <div class="controls-bar" id="controls-bar">
              <div class="progress-container" id="progress-container">
                <div class="progress-bar">
                  <div class="progress-filled" id="progress-filled"></div>
                  <div class="progress-handle" id="progress-handle"></div>
                </div>
                <div class="progress-tooltip hidden" id="progress-tooltip">00:00</div>
              </div>

              <div class="controls-row">
                <div class="controls-left">
                  <button class="ctrl-btn" id="play-pause-btn" onclick="togglePlay()">
                    <svg id="play-icon"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                  </button>
                  
                  <div class="volume-container">
                    <button class="ctrl-btn" onclick="toggleMute()">
                      <svg id="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
                  </div>

                  <span class="time-display" id="time-display">00:00 / 00:00</span>
                </div>

                <div class="controls-right">
                  <div class="dropdown">
                    <button class="ctrl-btn text-btn" id="speed-btn" onclick="toggleDropdown('speed-menu')">1x</button>
                    <div class="dropdown-content hidden" id="speed-menu">
                      <button onclick="setSpeed(0.5, this)">0.5x</button><button onclick="setSpeed(0.75, this)">0.75x</button><button onclick="setSpeed(1, this)" class="active">1x</button><button onclick="setSpeed(1.25, this)">1.25x</button><button onclick="setSpeed(1.5, this)">1.5x</button><button onclick="setSpeed(1.75, this)">1.75x</button><button onclick="setSpeed(2, this)">2x</button>
                    </div>
                  </div>

                  <div class="dropdown">
                    <button class="ctrl-btn text-btn" id="quality-btn" onclick="toggleDropdown('quality-menu')">جودة</button>
                    <div class="dropdown-content hidden" id="quality-menu"></div>
                  </div>

                  <button class="ctrl-btn" onclick="toggleFullscreen()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- تفاصيل الفيديو -->
        <div class="video-details">
          <div class="details-header">
             <h2 id="video-details-title"></h2>
             <div class="video-meta-tags">
               <span class="tag-badge" id="video-count-tag">0 فيديو</span>
               <span class="tag-badge" id="watched-count-tag">0 تمت مشاهدته</span>
             </div>
          </div>
          
          <div class="video-nav-btns">
            <button class="btn-nav prev" onclick="playPrevVideo()">السابق <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg></button>
            <button class="btn-nav next" onclick="playNextVideo()">التالي <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button>
          </div>
        </div>
      </div>

      <!-- القائمة الجانبية (شمال) -->
      <div class="player-side-col">
        <div class="side-header">
          <div class="side-title">
            <h3>محتوي المحاضرة</h3>
            <p id="side-subtitle">0 فيديو</p>
          </div>
        </div>
        
        <div class="side-list" id="side-videos-list"></div>
      </div>

    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
