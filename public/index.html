<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل المحاضرات - برتقالي</title>
    <style>
        :root {
            /* درجات اللون البرتقالي */
            --primary-orange: #FF7A00;
            --primary-orange-hover: #E66E00;
            --bg-dark: #0f111a;
            --card-bg: #1a1d27;
            --text-light: #ffffff;
            --text-muted: #8892b0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            direction: rtl;
        }

        /* شريط التنقل العلوي */
        .top-navbar {
            background-color: var(--card-bg);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2e3d;
        }

        .back-btn {
            background-color: transparent;
            color: var(--text-light);
            border: 1px solid var(--text-muted);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .back-btn:hover {
            border-color: var(--primary-orange);
            color: var(--primary-orange);
        }

        /* مشغل الفيديو */
        .video-container {
            width: 90%;
            max-width: 900px;
            margin: 20px auto;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary-orange); /* إطار برتقالي للفيديو */
        }

        .video-container img {
            width: 100%;
            display: block;
        }

        .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--primary-orange);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 122, 0, 0.4);
        }

        /* شريط التحكم بالفيديو */
        .video-controls {
            background: rgba(26, 29, 39, 0.9);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: absolute;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .progress-bar {
            flex-grow: 1;
            height: 5px;
            background-color: #444;
            border-radius: 5px;
            position: relative;
        }

        .progress-fill {
            width: 2%;
            height: 100%;
            background-color: var(--primary-orange);
            border-radius: 5px;
            position: absolute;
        }

        /* تفاصيل المحاضرة */
        .lecture-info {
            width: 90%;
            max-width: 900px;
            margin: 0 auto;
        }

        .lecture-title {
            font-size: 24px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .lecture-title::before {
            content: '✏️'; /* أيقونة القلم */
        }

        /* الإحصائيات (ثلاثة مربعات) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid transparent;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        /* الخط البرتقالي العلوي للمربعات */
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background-color: var(--primary-orange);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* أزرار السابق والتالي */
        .nav-buttons {
            display: flex;
            justify-content: flex-start; /* في اليمين */
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-light);
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-btn:hover {
            background-color: var(--primary-orange);
        }

        /* قائمة المحتوى */
        .content-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a2e3d;
            padding-bottom: 15px;
        }

        .content-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .search-bar {
            background-color: var(--bg-dark);
            border: 1px solid #333;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            width: 60%;
            outline: none;
            transition: 0.3s;
        }

        .search-bar:focus {
            border-color: var(--primary-orange);
        }

        /* عنصر فيديو */
        .video-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: var(--bg-dark);
            border-radius: 8px;
            margin-bottom: 10px;
            border-right: 4px solid var(--primary-orange); /* الخط البرتقالي الجانبي */
        }

        .video-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-number {
            background-color: var(--primary-orange);
            color: white;
            width: 25px;
            height: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
        }

        .video-title {
            font-size: 15px;
        }

        .video-time {
            color: var(--text-muted);
            font-size: 13px;
            direction: ltr;
        }

    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-navbar">
        <button class="back-btn">↩ رجوع للمحتوى</button>
        <div style="font-weight: bold; color: var(--primary-orange);">Dorosak Plus</div>
    </div>

    <!-- مشغل الفيديو -->
    <div class="video-container">
        <!-- صورة توضيحية بدلاً من الفيديو -->
        <img src="https://via.placeholder.com/900x500/1a1d27/FF7A00?text=Video+Player+Mockup" alt="Video">
        <div class="play-overlay">▶</div>
        <div class="video-controls">
            <span style="font-size: 12px;">1:21 / 1:04:55</span>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- تفاصيل المحاضرة -->
    <div class="lecture-info">
        <div class="lecture-title">01 الكشف عن الكاتيونات</div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">0</div>
                <div class="stat-label">فيديو مكتمل</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">9</div>
                <div class="stat-label">فيديو متبقي</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">0%</div>
                <div class="stat-label">إنجاز المحاضرة</div>
            </div>
        </div>

        <div class="nav-buttons">
            <button class="nav-btn">السابق</button>
            <button class="nav-btn">التالي →</button>
        </div>

        <!-- قائمة المحتوى -->
        <div class="content-section">
            <div class="content-header">
                <h3>محتوى المحاضرة</h3>
                <input type="text" class="search-bar" placeholder="ابحث عن فيديو...">
            </div>

            <!-- عناصر الفيديو -->
            <div class="video-item">
                <div class="video-item-info">
                    <div class="video-number">1</div>
                    <div class="video-title">ملخص الدرس الثاني الباب الثاني</div>
                </div>
                <div class="video-time">0:00 / لم يبدأ بعد</div>
            </div>
            
            <div class="video-item" style="border-right-color: #555; opacity: 0.7;">
                <div class="video-item-info">
                    <div class="video-number" style="background-color: #555;">2</div>
                    <div class="video-title">تجربة الكشف عن الكاتيونات</div>
                </div>
                <div class="video-time">12:30</div>
            </div>
        </div>
    </div>

</body>
</html>
