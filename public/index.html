<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>كورساتك - منصة تعليمية</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <!-- خط Cairo ليتطابق مع خط الموقع -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">
  
  <!-- الهيدر العلوي -->
  <header class="topbar">
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" title="تبديل الثيم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
      <div class="profile-dropdown">
        <button class="profile-btn">
          <div class="avatar">أ</div>
          <div class="profile-info">
            <span class="name">أحمد شلبي</span>
            <span class="badge">ثانوية عامة</span>
          </div>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="topbar-left" onclick="goHome()" style="cursor:pointer">
      <div class="brand-text">
        <h1>كورساتك</h1>
        <p>منتداكر بطعم الضحك</p>
      </div>
      <div class="brand-logo">Coursatk</div>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main id="app">
    <div class="loading">جاري التحميل...</div>
  </main>

  <!-- مشغل الفيديو (المودال) -->
  <div id="player-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <button class="back-btn" onclick="closePlayer()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          رجوع
        </button>
        <div class="modal-titles">
          <h3 id="player-title"></h3>
          <p>اختر المنصة المناسبة للمشاهدة</p>
        </div>
        <div class="modal-action-icon">
           <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <div class="player-container">
        <video id="video" controls playsinline></video>
        <div id="player-status" class="status hidden"></div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
