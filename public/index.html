<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار - ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:#060910;color:#deeaff;direction:rtl;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#0f1a2c;border:1px solid rgba(96,165,250,.22);border-radius:20px;padding:40px;max-width:400px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.6)}
h1{font-size:24px;margin-bottom:20px;text-align:center}
h1 span{background:linear-gradient(90deg,#06b6d4,#3b82f6,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent}
label{display:block;font-size:13px;font-weight:800;margin-bottom:8px;color:#8aaec8}
input{width:100%;padding:15px;background:#060910;border:1px solid rgba(96,165,250,.22);border-radius:13px;color:#deeaff;font-size:24px;text-align:center;letter-spacing:.3em;font-weight:900;outline:none;font-family:inherit}
input:focus{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,.15)}
button{width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;border:0;border-radius:13px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px rgba(37,99,235,.4)}
button:hover{transform:translateY(-2px)}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:16px;padding:14px;border-radius:13px;font-size:13px;font-weight:800;text-align:center;display:none}
.msg.show{display:block}
.msg.loading{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:#67e8f9}
.msg.error{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.28);color:#f87171}
.msg.success{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.28);color:#34d399}
</style>
</head>
<body>
<div class="box">
  <h1>ثانوية <span>club</span></h1>
  <form id="f">
    <label for="code">كود الدخول (7 أرقام)</label>
    <input id="code" type="text" inputmode="numeric" maxlength="7" placeholder="0000000" required autofocus>
    <button type="submit" id="btn">دخول</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
(function(){
  var form = document.getElementById('f');
  var code = document.getElementById('code');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');

  code.addEventListener('input', function(){
    code.value = code.value.replace(/\D/g, '').slice(0, 7);
  });

  function show(type, text){
    msg.className = 'msg show ' + type;
    msg.textContent = text;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var val = code.value.trim();
    if (!/^\d{7}$/.test(val)) {
      show('error', 'اكتب 7 أرقام');
      return;
    }
    btn.disabled = true;
    show('loading', 'جاري التحقق...');

    var token = 'bypass_' + val + '_' + Date.now();
    try {
      localStorage.setItem('cstk_tok', token);
      localStorage.setItem('cstk_code', val);
      localStorage.setItem('cstk_me', JSON.stringify({name: 'طالب', code: val}));
    } catch(_) {}

    show('success', 'تمام! جاري فتح المواد...');

    setTimeout(function(){
      window.location.href = 'subjects.html';
    }, 500);
  });
})();
</script>
</body>
</html>
