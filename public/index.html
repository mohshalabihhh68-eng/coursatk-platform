<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ثانوية World</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <style>
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-overlay.hidden { display: none; }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .login-box h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-box p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 28px;
    }
    .login-box input {
      width: 100%;
      padding: 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: 8px;
      font-family: inherit;
      outline: none;
      transition: var(--transition);
      margin-bottom: 16px;
    }
    .login-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .login-box button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--accent-glow);
    }
    .login-box button:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }
    .login-status {
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }
    .login-status.show { display: block; }
    .login-status.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }
    .login-status.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
    .login-hint {
      margin-top: 20px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-overlay hidden" id="login-overlay">
    <div class="login-box">
      <h1>ثانوية World</h1>
      <p>اكتب كود الاشتراك للدخول</p>
      <form id="login-form">
        <input id="code-input" type="text" inputmode="numeric" maxlength="7" placeholder="0000000" autocomplete="one-time-code" required />
        <button type="submit" id="login-btn">دخول</button>
        <div class="login-status" id="login-status"></div>
      </form>
      <div class="login-hint">الكود مكوّن من 7 أرقام</div>
    </div>
  </div>

  <header class="topbar">
    <div class="logo" onclick="goHome()"> ثانوية World</div>
    <div id="profile-chip" class="chip hidden"></div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="/profile.html" style="color:var(--accent);font-size:0.85rem;font-weight:600;text-decoration:none;padding:6px 12px;background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);border-radius:8px">ملفي</a>
      <button onclick="logout()" style="background:transparent;border:1px solid var(--border-light);color:var(--text-muted);padding:6px 12px;border-radius:8px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:inherit">خروج</button>
    </div>
  </header>

  <main id="app">
    <div class="loading">جاري التحميل...</div>
  </main>

  <div id="player-modal" class="modal hidden">
    <div class="modal-box">
      <button class="close-btn" onclick="closePlayer()">✕</button>
      <h3 id="player-title"></h3>
      <video id="video" controls playsinline></video>
      <div id="player-status" class="status"></div>
    </div>
  </div>

  <script>
    (function () {
      var overlay = document.getElementById("login-overlay");
      var form = document.getElementById("login-form");
      var input = document.getElementById("code-input");
      var btn = document.getElementById("login-btn");
      var status = document.getElementById("login-status");

      function showLogin() {
        overlay.classList.remove("hidden");
      }
      function hideLogin() {
        overlay.classList.add("hidden");
      }

      function show(type, text) {
        status.className = "login-status show " + type;
        status.textContent = text;
      }

      window.logout = function () {
        try {
          localStorage.removeItem("cstk_tok");
          localStorage.removeItem("cstk_code");
          localStorage.removeItem("cstk_me");
        } catch (e) {}
        window.location.reload();
      };

      var hasToken = false;
      try {
        hasToken = !!localStorage.getItem("cstk_tok");
      } catch (e) {}

      if (hasToken) {
        hideLogin();
      } else {
        showLogin();
      }

      input.addEventListener("input", function () {
        input.value = input.value.replace(/\D/g, "").slice(0, 7);
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var code = input.value.trim();
        if (!/^\d{7}$/.test(code)) {
          show("error", "اكتب 7 أرقام");
          return;
        }
        btn.disabled = true;
        show("success", "تمام! جاري التحميل...");

        var token = "bypass_" + code + "_" + Date.now();
        try {
          localStorage.setItem("cstk_tok", token);
          localStorage.setItem("cstk_code", code);
          localStorage.setItem("cstk_me", JSON.stringify({ name: "طالب", code: code }));
        } catch (err) {
          show("error", "المتصفح مش بيسمح بتخزين الجلسة");
          btn.disabled = false;
          return;
        }

        hideLogin();
        btn.disabled = false;
        setTimeout(function () {
          window.location.reload();
        }, 300);
      });
    })();
  </script>
  <script src="/app.js"></script>
</body>
</html>
