<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كورساتك — منصة تعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17"></script>
</head>
<body>

<!-- Header -->
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/" onclick="navigate('home', event)">
      <span class="brand-logo">🎓</span>
      <span>كورساتك<small>منصة تعليمية</small></span>
    </a>
    <div class="header-actions" id="headerActions"></div>
  </div>
</header>

<!-- Main Container (بيتبدل محتواه حسب الصفحة) -->
<main id="app" class="app-wrap"></main>

<!-- Login Screen -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-logo">🎓</div>
    <h2>أهلاً بيك</h2>
    <p>اكتب كود الاشتراك بتاعك عشان تدخل</p>
    <form id="loginForm">
      <div class="auth-field">
        <label>كود الدخول (7 أرقام)</label>
        <input type="text" id="codeInput" maxlength="7" inputmode="numeric" placeholder="0000000" required>
      </div>
      <button type="submit" class="auth-btn" id="loginBtn">دخول</button>
      <div class="auth-status" id="loginStatus"></div>
    </form>
  </div>
</div>

<script>
/* ==================== Router & State ==================== */
const state = {
  page: 'home',
  view: 'years',
  year: null,
  subject: null,
  teacher: null,
  chapter: null,
  lecture: null,
  videos: [],
  currentVideoIndex: -1,
  hls: null,
  hbTimer: null,
  videoReady: false,
};

const TOKEN_KEY = 'cstk_tok';
const appEl = document.getElementById('app');
const headerEl = document.getElementById('headerActions');

/* ==================== Check login ==================== */
function isLoggedIn() {
  return !!localStorage.getItem(TOKEN_KEY);
}

/* ==================== Header ==================== */
function renderHeader() {
  if (!isLoggedIn()) {
    headerEl.innerHTML = `<button class="btn btn-primary" onclick="showLogin()">تسجيل الدخول</button>`;
    return;
  }
  headerEl.innerHTML = `
    <button class="btn" onclick="navigate('profile')">👤 حسابي</button>
    <button class="btn" onclick="logout()">🚪 خروج</button>
  `;
}

/* ==================== Navigation ==================== */
function navigate(page, event) {
  if (event) event.preventDefault();
  state.page = page;
  renderHeader();
  renderPage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.navigate = navigate;

function logout() {
  if (!confirm('متأكد إنك عايز تسجّل الخروج؟')) return;
  localStorage.removeItem(TOKEN_KEY);
  navigate('home');
}

/* ==================== Show/Hide Login ==================== */
function showLogin() {
  document.getElementById('authScreen').classList.add('show');
  setTimeout(() => document.getElementById('codeInput').focus(), 200);
}
function hideLogin() {
  document.getElementById('authScreen').classList.remove('show');
}
window.showLogin = showLogin;
window.hideLogin = hideLogin;

/* ==================== Login Handler ==================== */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = document.getElementById('codeInput').value.trim();
  const status = document.getElementById('loginStatus');
  const btn = document.getElementById('loginBtn');
  
  if (!/^\d{7}$/.test(code)) {
    status.className = 'auth-status show error';
    status.textContent = 'اكتب كود صحيح مكوّن من 7 أرقام';
    return;
  }
  
  btn.disabled = true;
  btn.textContent = 'جاري التحقق...';
  status.className = 'auth-status show loading';
  status.textContent = 'بنراجع الكود بتاعك...';
  
  // ⚠️ السيرفر بتاعك مش عنده endpoint لتسجيل الدخول
  // عشان كده بنقبل أي كود من 7 أرقام ونحفظ توكن محلي
  setTimeout(() => {
    localStorage.setItem(TOKEN_KEY, 'auth_' + code);
    status.className = 'auth-status show success';
    status.textContent = '✅ تم الدخول بنجاح!';
    setTimeout(() => {
      hideLogin();
      renderHeader();
      navigate('subjects');
    }, 600);
  }, 800);
});

/* ==================== API Helper ==================== */
async function api(path) {
  const res = await fetch(path);
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { data = text; }
  if (!res.ok) throw new Error(data?.error || data?.message || 'HTTP ' + res.status);
  return data.data !== undefined ? data.data : data;
}

/* ==================== Helpers ==================== */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function extractArray(data, key) {
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data[key])) return data[key];
  return [];
}
function formatTime(sec) {
  if (isNaN(sec) || sec < 0) return '00:00';
  const t = Math.floor(sec);
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

/* ==================== Page Router ==================== */
function renderPage() {
  if (state.page === 'home') renderHome();
  else if (state.page === 'subjects') renderSubjectsPage();
  else if (state.page === 'profile') renderProfilePage();
  else if (state.page === 'player') renderPlayerPage();
}

/* ==================== Home Page ==================== */
function renderHome() {
  appEl.innerHTML = `
    <section class="hero">
      <div class="hero-copy">
        <div class="eyebrow"><i></i> منصة كورساتك · كل اللي محتاجه في مكان واحد</div>
        <h1>كل محاضراتك،<br><span class="gradient">في مكان واحد.</span></h1>
        <p>بدل ما تتشتت بين منصات كتير، اجمع محتوى المدرسين والشعب في مكان واحد. اختار خطتك، تابع محاضراتك، وركّز في اللي يهمك: <strong>مستقبلك.</strong></p>
        <div class="hero-actions">
          <button class="btn btn-primary btn-lg" onclick="isLoggedIn() ? navigate('subjects') : showLogin()">
            ابدأ الآن ←
          </button>
          <a class="btn btn-lg" href="#features">اعرف المزيد</a>
        </div>
      </div>
      <div class="hero-art">
        <div class="dashboard">
          <div class="dash-top">
            <div>
              <div class="dash-title">مساحة مذاكرتك</div>
              <div class="dash-sub">كورساتك التعليمية</div>
            </div>
            <span class="live-pill">● جاهز للمذاكرة</span>
          </div>
          <div class="dash-welcome">
            <small>أهلاً بيك في رحلتك</small>
            <b>ابدأ محاضرتك الجاية ✨</b>
          </div>
          <div class="mini-cards">
            <div class="mini-card"><div class="mini-icon">📚</div><b>المواد الدراسية</b><small>كل مادة في قسمها</small></div>
            <div class="mini-card"><div class="mini-icon">📺</div><b>المحاضرات</b><small>تابع وقت ما تحب</small></div>
            <div class="mini-card"><div class="mini-icon">⏰</div><b>نظّم وقتك</b><small>كمّل من حيث وقفت</small></div>
            <div class="mini-card"><div class="mini-icon">⭐</div><b>اشتراك شهري</b><small>سعر واضح وبسيط</small></div>
          </div>
        </div>
      </div>
    </section>
  `;
}

/* ==================== Subjects Page ==================== */
async function renderSubjectsPage() {
  if (!isLoggedIn()) { showLogin(); return; }
  
  appEl.innerHTML = `<div class="empty-state"><div class="spinner"></div><p style="margin-top:16px;">جاري تحميل المواد...</p></div>`;
  
  try {
    if (state.view === 'years') await loadYears();
    else if (state.view === 'subjects') await loadSubjects();
    else if (state.view === 'teachers') await loadTeachers();
    else if (state.view === 'chapters') await loadChapters();
    else if (state.view === 'lectures') await loadLectures();
    else if (state.view === 'content') await loadContent();
  } catch (e) {
    appEl.innerHTML = `<div class="error-state"><div class="error-state-icon">⚠️</div><h3>خطأ</h3><p>${esc(e.message)}</p><button onclick="navigate('subjects')">إعادة المحاولة</button></div>`;
  }
}

function renderBreadcrumb(items) {
  return `<div style="display:flex; gap:8px; padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; font-size:13px; margin-bottom:20px; flex-wrap:wrap;">
    ${items.map((it, i) => {
      const sep = i > 0 ? '<span style="color:var(--muted)">/</span>' : '';
      if (it.current) return `${sep}<span style="color:var(--text); font-weight:800;">${esc(it.label)}</span>`;
      return `${sep}<a href="#" onclick="event.preventDefault(); ${it.action}" style="color:#93c5fd; font-weight:700;">${esc(it.label)}</a>`;
    }).join('')}
  </div>`;
}

async function loadYears() {
  const data = await api('/api/years');
  const years = extractArray(data, 'years');
  appEl.innerHTML = `
    <div class="page-title">
      <div class="page-badge">📚 السنة الدراسية</div>
      <h1>اختار <span>سنتك</span></h1>
      <p>هتقدر تشوف المواد والمدرسين بعد كده</p>
    </div>
    <div class="grid">
      ${years.map(y => `
        <div class="card" onclick="state.year=${JSON.stringify(y).replace(/"/g,'&quot;')}; state.view='subjects'; renderSubjectsPage()">
          <div class="card-img">📚</div>
          <div class="card-body">
            <div class="card-title">${esc(y.name)}</div>
            <div class="card-meta"><span>${y.subjects_count || '—'} مادة</span><span>2027</span></div>
            <button class="card-btn">عرض المواد ←</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

async function loadSubjects() {
  const data = await api('/api/subjects/' + state.year.id);
  const subjects = extractArray(data, 'subjects');
  appEl.innerHTML = `
    ${renderBreadcrumb([{ label: 'الرئيسية', action: "state.view='years'; renderSubjectsPage()" }, { label: state.year.name, current: true }])}
    <div class="page-title">
      <div class="page-badge">📖 المواد</div>
      <h1>مواد <span>${esc(state.year.name)}</span></h1>
    </div>
    <div class="grid">
      ${subjects.map(s => `
        <div class="card" onclick="state.subject=${JSON.stringify(s).replace(/"/g,'&quot;')}; state.view='teachers'; renderSubjectsPage()">
          <div class="card-img">📖</div>
          <div class="card-body">
            <div class="card-title">${esc(s.name)}</div>
            <div class="card-meta"><span>${s.teachers_count || '—'} مدرس</span><span>📚</span></div>
            <button class="card-btn">عرض المدرسين ←</button>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

async function loadTeachers() {
  const data = await api('/api/subjects/' + state.subject.id + '/teachers');
  const teachers = extractArray(data, 'teachers');
  appEl.innerHTML = `
    ${renderBreadcrumb([
      { label: 'الرئيسية', action: "state.view='years'; renderSubjectsPage()" },
      { label: state.year.name, action: "state.view='subjects'; renderSubjectsPage()" },
      { label: state.subject.name, current: true }
    ])}
    <div class="page-title">
      <div class="page-badge">👨‍🏫 المدرسين</div>
      <h1>مدرسين <span>${esc(state.subject.name)}</span></h1>
    </div>
    <div class="grid">
      ${teachers.map(t => `
        <div class="teacher-card" onclick="state.teacher=${JSON.stringify(t).replace(/"/g,'&quot;')}; state.view='chapters'; renderSubjectsPage()">
          <div class="teacher-top">
            <div class="teacher-info">
              <div class="teacher-role">مدرس المادة</div>
              <div class="teacher-name">${esc(t.name)}</div>
            </div>
            <div class="teacher-avatar">👨‍🏫</div>
          </div>
          <div class="teacher-stats">
            <span class="count-badge">${t.chapter_count || 0}</span>
            <span>الفصول المتاحة 📚</span>
          </div>
          <button class="card-btn">اكتشف الفصول ←</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function loadChapters() {
  const data = await api('/api/teachers/' + state.teacher.id + '/chapters');
  const chapters = extractArray(data, 'chapters');
  appEl.innerHTML = `
    ${renderBreadcrumb([
      { label: 'الرئيسية', action: "state.view='years'; renderSubjectsPage()" },
      { label: state.year.name, action: "state.view='subjects'; renderSubjectsPage()" },
      { label: state.subject.name, action: "state.view='teachers'; renderSubjectsPage()" },
      { label: state.teacher.name, current: true }
    ])}
    <div class="page-title">
      <div class="page-badge">📖 الفصول</div>
      <h1>فصول <span>${esc(state.teacher.name)}</span></h1>
    </div>
    <div class="grid">
      ${chapters.map(c => `
        <div class="teacher-card" onclick="state.chapter=${JSON.stringify(c).replace(/"/g,'&quot;')}; state.view='lectures'; renderSubjectsPage()">
          <div class="teacher-top">
            <div class="teacher-info">
              <div class="teacher-role">الفصل ${c.order || ''}</div>
              <div class="teacher-name">${esc(c.name)}</div>
            </div>
            <div class="teacher-avatar">📖</div>
          </div>
          <div class="teacher-stats">
            <span class="count-badge">${c.lecture_count || 0}</span>
            <span>عدد المحاضرات ⏱</span>
          </div>
          <button class="card-btn">مشاهدة المحاضرات ←</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function loadLectures() {
  const data = await api('/api/chapters/' + state.chapter.id + '/lectures');
  const lectures = extractArray(data, 'lectures');
  appEl.innerHTML = `
    ${renderBreadcrumb([
      { label: 'الرئيسية', action: "state.view='years'; renderSubjectsPage()" },
      { label: state.year.name, action: "state.view='subjects'; renderSubjectsPage()" },
      { label: state.subject.name, action: "state.view='teachers'; renderSubjectsPage()" },
      { label: state.teacher.name, action: "state.view='chapters'; renderSubjectsPage()" },
      { label: state.chapter.name, current: true }
    ])}
    <div class="page-title">
      <div class="page-badge">📺 المحاضرات</div>
      <h1>${esc(state.chapter.name)}</h1>
    </div>
    <div class="grid">
      ${lectures.map((l, idx) => `
        <div class="lecture-card">
          <div class="lecture-header">
            <div class="lecture-num">المحاضرة ${idx + 1}</div>
            <div class="lecture-title">${esc(l.name)}</div>
          </div>
          <div class="content-icons">
            <div class="content-icon-item"><div class="content-icon-icon">📺</div><div class="content-icon-val">${l.video_count || 0}</div><div class="content-icon-label">فيديو</div></div>
            <div class="content-icon-item"><div class="content-icon-icon">📄</div><div class="content-icon-val">${l.pdf_count || 0}</div><div class="content-icon-label">ملف</div></div>
            <div class="content-icon-item"><div class="content-icon-icon">📝</div><div class="content-icon-val">${l.exam_count || 0}</div><div class="content-icon-label">امتحان</div></div>
          </div>
          <button class="card-btn" onclick="state.lecture=${JSON.stringify(l).replace(/"/g,'&quot;')}; state.view='content'; renderSubjectsPage()">محتوى المحاضرة ←</button>
        </div>
      `).join('')}
    </div>
  `;
}

async function loadContent() {
  const data = await api('/api/lectures/' + state.lecture.id + '/content');
  const videos = data.videos || (Array.isArray(data) ? data : []);
  const pdfs = data.pdfs || [];
  
  let html = `
    ${renderBreadcrumb([
      { label: 'الرئيسية', action: "state.view='years'; renderSubjectsPage()" },
      { label: state.subject.name, action: "state.view='teachers'; renderSubjectsPage()" },
      { label: state.teacher.name, action: "state.view='chapters'; renderSubjectsPage()" },
      { label: state.chapter.name, action: "state.view='lectures'; renderSubjectsPage()" },
      { label: state.lecture.name, current: true }
    ])}
    <div class="page-title">
      <div class="page-badge">📺 محتوى المحاضرة</div>
      <h1>${esc(state.lecture.name)}</h1>
    </div>
  `;
  
  if (videos.length) {
    html += `
      <h2 style="font-size:18px; font-weight:900; margin:24px 0 14px;">📺 الفيديوهات (${videos.length})</h2>
      <div class="grid">
        ${videos.map((v, i) => `
          <div class="video-card" onclick="openPlayer(${i})">
            <div class="video-thumb">
              📺
              <div class="video-badge">فيديو #${i + 1}</div>
              <div class="video-duration">⏱ ${v.duration || '00:00'}</div>
            </div>
            <div class="video-info">
              <div class="video-title">${esc(v.title)}</div>
              <div class="video-play-btn">▶ تشغيل</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  if (pdfs.length) {
    html += `
      <h2 style="font-size:18px; font-weight:900; margin:28px 0 14px;">📄 الملفات (${pdfs.length})</h2>
      <div class="grid">
        ${pdfs.map(p => `
          <div class="pdf-card">
            <div class="pdf-icon">📄</div>
            <div class="pdf-info"><div class="pdf-title">${esc(p.title)}</div></div>
            <a href="${esc(p.url || '#')}" target="_blank" class="pdf-btn">فتح</a>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  if (!videos.length && !pdfs.length) {
    html += `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>لا يوجد محتوى</h3></div>`;
  }
  
  appEl.innerHTML = html;
  state.videos = videos;
}

function openPlayer(index) {
  if (!state.videos[index]) return;
  state.currentVideoIndex = index;
  state.page = 'player';
  renderHeader();
  renderPlayerPage();
}
window.openPlayer = openPlayer;

/* ==================== Profile Page ==================== */
async function renderProfilePage() {
  if (!isLoggedIn()) { showLogin(); return; }
  
  appEl.innerHTML = `<div class="empty-state"><div class="spinner"></div></div>`;
  
  try {
    const data = await api('/api/profile');
    const p = data.data || data;
    
    appEl.innerHTML = `
      <div class="page-title">
        <div class="page-badge">👤 حسابي</div>
        <h1>${esc(p.name || 'الطالب')}</h1>
        <p>كود الاشتراك: ${esc(p.code || '—')}</p>
      </div>
      <div class="grid">
        <div class="teacher-card">
          <div class="teacher-top">
            <div class="teacher-info">
              <div class="teacher-role">الاسم</div>
              <div class="teacher-name">${esc(p.name || '—')}</div>
            </div>
            <div class="teacher-avatar">👤</div>
          </div>
        </div>
        <div class="teacher-card">
          <div class="teacher-info">
            <div class="teacher-role">الكود</div>
            <div class="teacher-name">${esc(p.code || '—')}</div>
          </div>
        </div>
        <div class="teacher-card">
          <div class="teacher-info">
            <div class="teacher-role">الشعبة</div>
            <div class="teacher-name">${esc(p.section || '—')}</div>
          </div>
        </div>
      </div>
    `;
  } catch (e) {
    appEl.innerHTML = `<div class="error-state"><div class="error-state-icon">⚠️</div><h3>فشل تحميل البيانات</h3><p>${esc(e.message)}</p></div>`;
  }
}

/* ==================== Player Page ==================== */
function renderPlayerPage() {
  const videos = state.videos || [];
  const current = state.currentVideoIndex;
  const v = videos[current];
  
  appEl.innerHTML = `
    <div class="player-page">
      <div class="player-main">
        <div class="player-wrapper">
          <video id="videoEl" controls playsinline webkit-playsinline></video>
          <div class="player-overlay" id="playerOverlay">
            <div class="spinner"></div>
            <p>جاري تجهيز الفيديو...</p>
          </div>
        </div>
        <div class="player-title">${esc(v?.title || '')}</div>
        <div class="player-meta">
          <span>🎓 ${esc(state.lecture?.name || '')}</span>
        </div>
        <div class="player-controls">
          <button class="player-btn" onclick="navigate('subjects')">← رجوع للمواد</button>
          <button class="player-btn" onclick="skip(-10)">⏪ -10s</button>
          <button class="player-btn" onclick="skip(10)">+10s ⏩</button>
          <select class="speed-select" onchange="changeSpeed(this.value)">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </div>
      </div>
      <aside class="playlist">
        <div class="playlist-head">
          <h3>📺 محتويات المحاضرة</h3>
          <p>${videos.length} فيديو</p>
        </div>
        <div class="playlist-body">
          ${videos.map((vv, i) => `
            <div class="playlist-item ${i === current ? 'active' : ''}" onclick="openPlayer(${i})">
              <div class="playlist-num">${i + 1}</div>
              <div class="playlist-info">
                <div class="playlist-title">${esc(vv.title)}</div>
                <div class="playlist-meta">${vv.duration || '—'}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </aside>
    </div>
  `;
  
  playCurrentVideo();
}

async function playCurrentVideo() {
  const video = document.getElementById('videoEl');
  const overlay = document.getElementById('playerOverlay');
  const v = state.videos[state.currentVideoIndex];
  if (!v) return;
  
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  if (state.hbTimer) { clearInterval(state.hbTimer); state.hbTimer = null; }
  
  try {
    const session = await api('/api/video/' + v.id + '/play', { method: 'POST' });
    const tok = session.token || session.session_token;
    const swId = session.video_id;
    const hbUrl = session.heartbeat_url;
    
    const masterUrl = '/api/stream?path=' + encodeURIComponent('videos/' + swId + '/stream/master.m3u8') + '&t=' + encodeURIComponent(tok);
    const masterRes = await fetch(masterUrl);
    const masterText = await masterRes.text();
    const variantRel = masterText.split('\n').map(l => l.trim()).find(l => l && l.charAt(0) !== '#');
    
    const variantUrl = '/api/stream?path=' + encodeURIComponent('videos/' + swId + '/stream/' + variantRel) + '&t=' + encodeURIComponent(tok);
    
    const saved = JSON.parse(localStorage.getItem('cstk_w_' + v.id) || 'null');
    const resumeAt = saved?.currentTime > 2 && !saved?.watched ? saved.currentTime : 0;
    
    if (window.Hls && Hls.isSupported()) {
      state.hls = new Hls({ enableWorker: false });
      state.hls.loadSource(variantUrl);
      state.hls.attachMedia(video);
      state.hls.on(Hls.Events.MANIFEST_PARSED, () => {
        overlay.classList.add('hidden');
        state.videoReady = true;
        if (resumeAt) video.currentTime = resumeAt;
        video.play().catch(() => {});
      });
      state.hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) overlay.innerHTML = '<p style="color:#fb7185;">فشل تشغيل الفيديو</p>';
      });
    } else {
      video.src = variantUrl;
      video.addEventListener('loadedmetadata', () => {
        overlay.classList.add('hidden');
        state.videoReady = true;
        if (resumeAt) video.currentTime = resumeAt;
        video.play().catch(() => {});
      }, { once: true });
    }
    
    video.addEventListener('timeupdate', () => {
      if (!state.videoReady) return;
      const t = video.currentTime || 0;
      const d = video.duration || 0;
      const pct = d ? Math.min(100, Math.round(t / d * 100)) : 0;
      localStorage.setItem('cstk_w_' + v.id, JSON.stringify({
        videoId: v.id, title: v.title, currentTime: t, duration: d,
        percent: pct, watched: pct >= 90, updatedAt: Date.now()
      }));
    });
    
    if (hbUrl) {
      state.hbTimer = setInterval(() => {
        fetch('/api/heartbeat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: hbUrl, token: tok })
        }).catch(() => {});
      }, 25000);
    }
  } catch (e) {
    overlay.innerHTML = '<p style="color:#fb7185;">فشل: ' + esc(e.message) + '</p>';
  }
}

function skip(sec) {
  const video = document.getElementById('videoEl');
  if (video && video.duration) {
    video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + sec));
  }
}
window.skip = skip;

function changeSpeed(val) {
  const video = document.getElementById('videoEl');
  if (video) video.playbackRate = parseFloat(val);
}
window.changeSpeed = changeSpeed;

/* ==================== Init ==================== */
renderHeader();
renderPage();
</script>
