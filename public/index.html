<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>كورساتك - منصة تعليمية</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body data-theme="dark">

  <header class="topbar">
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" title="تبديل الثيم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>
    <div class="topbar-left" onclick="goHome()" style="cursor:pointer">
      <div class="brand-text">
        <h1>كورساتك</h1>
        <p>هنذاكر بطعم الضحك</p>
      </div>
      <div class="brand-logo">C</div>
    </div>
  </header>

  <main id="app">
    <div class="loading">جاري التحميل...</div>
  </main>

  <div id="player-modal" class="modal hidden">
    <div class="modal-box">

      <div class="modal-header">
        <button class="back-btn" onclick="closePlayer()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m15 18-6-6 6-6"/>
          </svg>
          رجوع
        </button>
        <div class="modal-titles">
          <h3 id="player-title"></h3>
        </div>
        <div class="modal-action-icon">
          <svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>

      <div class="custom-player-container" id="custom-player">
        <!-- 🔥 الفيديو -->
        <video id="video" playsinline></video>

        <!-- شاشة التحميل -->
        <div id="player-status" class="player-status">
          <div class="spinner"></div>
          <span>جاري التشغيل...</span>
        </div>

        <!-- 🔥 طبقة النقرات -->
        <div class="click-layer" id="click-layer"></div>

        <!-- مؤشر التقديم/التأخير -->
        <div id="seek-indicator" class="seek-indicator hidden">
          <span class="seek-icon">⏩</span>
          <span>+10s</span>
        </div>

        <!-- أدوات التحكم -->
        <div class="controls-bar" id="controls-bar">
          <div class="progress-container" onclick="seekVideo(event)">
            <div class="progress-bar" id="progress-bar">
              <div class="progress-filled" id="progress-filled"></div>
            </div>
          </div>

          <div class="controls-row">
            <div class="controls-left">
              <button class="ctrl-btn" onclick="togglePlay()" id="play-pause-btn">
                <svg id="play-icon"  viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" class="hidden">
                  <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
              </button>

              <div class="volume-container">
                <button class="ctrl-btn" onclick="toggleMute()">
                  <svg id="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                  </svg>
                </button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
              </div>

              <span class="time-display" id="time-display">00:00 / 00:00</span>
            </div>

            <div class="controls-right">
              <div class="dropdown">
                <button class="ctrl-btn text-btn" id="speed-btn" onclick="toggleDropdown('speed-menu')">1x</button>
                <div class="dropdown-content hidden" id="speed-menu">
                  <button onclick="setSpeed(0.5,  this)">0.5x</button>
                  <button onclick="setSpeed(0.75, this)">0.75x</button>
                  <button onclick="setSpeed(1,    this)" class="active">1x</button>
                  <button onclick="setSpeed(1.25, this)">1.25x</button>
                  <button onclick="setSpeed(1.5,  this)">1.5x</button>
                  <button onclick="setSpeed(2,    this)">2x</button>
                </div>
              </div>

              <div class="dropdown">
                <button class="ctrl-btn text-btn" id="quality-btn" onclick="toggleDropdown('quality-menu')">جودة</button>
                <div class="dropdown-content hidden" id="quality-menu">
                  <button onclick="setQuality(-1,this)" class="active">تلقائي</button>
                </div>
              </div>

              <button class="ctrl-btn" onclick="toggleFullscreen()" title="ملء الشاشة">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
