<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060910">
<title>ثانوية club — كل محاضراتك في مكان واحد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060910;--bg2:#0b1220;--panel:#0f1a2c;--panel2:#152035;--panel3:#1b2a42;
  --line:rgba(96,165,250,.11);--line2:rgba(96,165,250,.22);
  --text:#deeaff;--muted:#5a7491;--muted2:#8aaec8;
  --blue:#3b82f6;--blue2:#60a5fa;--cyan:#22d3ee;--cyan2:#67e8f9;
  --green:#34d399;--red:#f87171;
  --grad:linear-gradient(135deg,#2563eb,#1d4ed8);
  --grad2:linear-gradient(135deg,#06b6d4,#2563eb);
  --grad3:linear-gradient(90deg,#06b6d4,#3b82f6 50%,#818cf8);
  --shadow:0 24px 64px rgba(0,0,0,.6);
  --font:'Cairo',system-ui,sans-serif
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);overflow-x:hidden;direction:rtl;min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 950px 650px at 88% -8%,rgba(37,99,235,.2),transparent),
             radial-gradient(ellipse 700px 500px at -5% 80%,rgba(6,182,212,.1),transparent)}
button,input{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.brand-logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;
  background:var(--grad);box-shadow:0 8px 28px rgba(37,99,235,.45);
  position:relative;overflow:hidden;flex-shrink:0}
.brand-logo svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
.g{background:var(--grad3);background-clip:text;-webkit-background-clip:text;color:transparent}

.auth-wrap{position:relative;z-index:1;width:min(100%,420px);padding:24px}
.auth-panel{border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(15,26,44,.97),rgba(11,18,32,.97));box-shadow:var(--shadow);padding:32px}
.panel-head{text-align:center;margin-bottom:24px}
.panel-logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
  background:var(--grad);box-shadow:0 8px 28px rgba(37,99,235,.45);margin:0 auto 14px}
.panel-logo svg{width:26px;height:26px;stroke:#fff}
.panel-head h2{font-size:24px;margin:0 0 6px;font-weight:900}
.panel-head p{font-size:13px;line-height:1.9;color:var(--muted);margin:0}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:900;color:var(--muted2);margin-bottom:8px}
.field input{width:100%;padding:16px;background:rgba(6,9,16,.9);border:1px solid var(--line);
  border-radius:13px;color:var(--text);font-family:inherit;font-size:28px;outline:none;transition:.2s;
  text-align:center;letter-spacing:.3em;font-weight:900}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.btn-submit{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  border-radius:14px;padding:16px;font-family:inherit;font-weight:900;font-size:15px;
  background:var(--grad);color:#fff;border:0;cursor:pointer;
  box-shadow:0 10px 30px rgba(37,99,235,.35);transition:transform .18s,box-shadow .18s}
.btn-submit:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(37,99,235,.5)}
.btn-submit:disabled{opacity:.6;cursor:wait;transform:none}
.auth-status{display:none;margin-top:16px;padding:14px;border-radius:13px;
  font-size:13px;line-height:1.9;font-weight:800;text-align:center}
.auth-status.show{display:block}
.auth-status.loading{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:var(--cyan2)}
.auth-status.error{background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.28);color:var(--red)}
.auth-status.success{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.28);color:var(--green)}
.auth-spinner{display:inline-block;vertical-align:middle;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-panel">
    <div class="panel-head">
      <div class="panel-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M4 5.5v13A2.5 2.5 0 0 1 6.5 16H20M9 7h7M9 10h7"/></svg></div>
      <h2>أهلاً بيك في <span class="g">ثانوية club</span></h2>
      <p>اكتب كود الاشتراك المكوّن من 7 أرقام.</p>
    </div>
    <form id="code-form">
      <div class="field">
        <label for="code">كود الدخول (7 أرقام)</label>
        <input id="code" inputmode="numeric" autocomplete="one-time-code"
               maxlength="7" pattern="[0-9]{7}" placeholder="0000000" required>
      </div>
      <button class="btn-submit" id="submit-btn" type="submit">
        دخول <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
      </button>
      <div class="auth-status" id="status" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>

<script>
(function(){
'use strict';
try{if(localStorage.getItem('cstk_tok')){window.location.href='subjects.html';return}}catch(_){}

var form=document.getElementById('code-form');
var code=document.getElementById('code');
var statusBox=document.getElementById('status');
var submitBtn=document.getElementById('submit-btn');
var busy=false;

code.addEventListener('input',function(){
  code.value=code.value.replace(/\D/g,'').slice(0,7);
  if(statusBox.classList.contains('error')){statusBox.className='auth-status';statusBox.textContent=''}
});

function showSt(type,msg){
  statusBox.className='auth-status show '+type;
  if(type==='loading')statusBox.innerHTML=msg+'<span class="auth-spinner"></span>';
  else statusBox.textContent=msg;
}

form.addEventListener('submit',function(e){
  e.preventDefault();
  if(busy)return;
  var val=code.value.trim();
  if(!/^\d{7}$/.test(val)){showSt('error','اكتب كود صحيح مكوّن من 7 أرقام.');code.focus();return}
  busy=true;submitBtn.disabled=true;
  showSt('loading','جاري التحقق من الكود');
  setTimeout(function(){
    localStorage.setItem('cstk_tok','bypass_'+val+'_'+Date.now());
    localStorage.setItem('cstk_code',val);
    localStorage.setItem('cstk_me',JSON.stringify({name:'طالب',code:val}));
    showSt('success','تمام! جاري فتح المواد...');
    setTimeout(function(){window.location.href='subjects.html'},400);
  },400);
});
})();
</script>
</body>
</html>
