in-top:16px}.loading,.error{max-width:460px;margin:12vh auto;text-align:center;padding:28px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}.loader{width:38px;height:38px;border:3px solid #ffffff20;border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 15px}.error p{color:var(--muted);font-size:13px;line-height:1.8}@keyframes spin{to{transform:rotate(360deg)}}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:620px){.wrap{padding:20px 13px 45px}.hero{padding:19px}.hero-inner{align-items:flex-start;gap:13px}.avatar{width:66px;height:66px;border-radius:20px;font-size:26px}.name{font-size:19px}.hero-tag{display:none}.stats{gap:8px}.stat{padding:12px 10px;border-radius:15px}.stat strong{font-size:22px}.stat span{font-size:10px}.details{grid-template-columns:1fr}.detail{padding:13px}.countdown{gap:6px}.time{padding:10px 3px}.time b{font-size:21px}.topin{padding:10px 13px}.btn{padding:8px 10px}.brand{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

<script>
(function(){'use strict';
var API='https://coursattk-production.up.railway.app',TOKEN_KEY='cstk_tok',WATCH_PREFIX='cstk_w_',me=null,timer=null,toastTimer=null;
function $(id){return document.getElementById(id)}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function asDate(v){if(v==null||v==='')return null;var d=(typeof v==='number'||/^\d+$/.test(String(v)))?new Date(Number(v)):new Date(v);return isNaN(d.getTime())?null:d}
function dateLabel(v){var d=asDate(v);return d?d.toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}):'غير محدد'}
function toast(s){var t=$('toast');t.textContent=s;t.style.opacity='1';t.style.transform='translate(-50%,0)';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.opacity='0';t.style.transform='translate(-50%,20px)'},2300)}
function watchStats(){var total=0,done=0,seconds=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k||k.indexOf(WATCH_PREFIX)!==0)continue;var x;try{x=JSON.parse(localStorage.getItem(k)||'null')}catch(e){x=null}if(!x)continue;total++;if(x.watched||(+x.percent||0)>=90)done++;seconds+=Math.max(0,+x.currentTime||0)}}catch(e){}return {total:total,done:done,active:Math.max(0,total-done),minutes:Math.floor(seconds/60)}}

function status(m){var expiry=asDate(m.expiresAt),left=expiry?expiry.getTime()-Date.now():null;if(left===null)return {label:'الحالة غير محددة',cls:'warn',left:null};if(left<=0)return {label:'منتهي',cls:'off',left:left};if(left<=7*86400000)return {label:'ينتهي قريبًا',cls:'warn',left:left};return {label:'نشط',cls:'',left:left}}
function timerStart(){clearInterval(timer);function tick(){if(!me)return;var s=status(me),n=Math.max(0,Math.floor((s.left||0)/1000)),d=Math.floor(n/86400);n%=86400;var h=Math.floor(n/3600);n%=3600;var m=Math.floor(n/60),ss=n%60;[['days',d],['hours',h],['mins',m],['secs',ss]].forEach(function(x){var el=$(x[0]);if(el)el.textContent=String(x[1]).padStart(2,'0')});var p=$('subProgress');if(p){var duration=Number(me.durationMs||me.subscriptionDurationMs||0);if(!duration&&me.createdAt&&me.expiresAt){var cd=asDate(me.createdAt),ed=asDate(me.expiresAt);if(cd&&ed)duration=ed.getTime()-cd.getTime();}var pct=duration>0?Math.max(0,Math.min(100,(s.left||0)/duration*100)):((s.left||0)>0?100:0);p.style.width=pct+'%';var t=$('progressText');if(t)t.textContent=duration>0?Math.round(pct)+'% من مدة الاشتراك المتبقية':'حسب تاريخ انتهاء الاشتراك'}}tick();timer=setInterval(tick,1000)}
function detail(iconName,label,value,extra){return '<div class="detail"><div class="di">'+icon(iconName)+'</div><div class="detailbody"><div class="label">'+label+'</div><div class="value '+(extra?'small':'')+'">'+value+'</div></div></div>'}
function render(m){me=m||{};var st=status(me),w=watchStats(),name=me.name||me.fullName||me.studentName||'الطالب',code=me.code||me.subscriptionCode||'—',year=me.yearName||me.gradeName||me.year||'—',devices=me.maxDevices||me.deviceLimit||1,plan=subType(me),expiry=dateLabel(me.expiresAt),created=dateLabel(me.createdAt),days=st.left===null?'—':Math.max(0,Math.ceil(st.left/86400000));
var codeHtml=esc(code);
$('main').innerHTML='<div class="heading"><span class="eyebrow">'+icon('sparkles')+' لوحة الطالب الشخصية</span><h1>أهلاً بيك، '+esc(name.split(' ')[0])+'</h1><p>كل تفاصيل حسابك واشتراكك وتقدّمك الدراسي في مكان واحد.</p></div>'+ 
'<section class="hero"><div class="hero-inner"><div class="avatar">'+esc((name.trim().charAt(0)||'ط').toUpperCase())+'</div><div style="min-width:0;flex:1"><div class="name">'+esc(name)+'</div><div class="subline"><span class="pill '+st.cls+'">'+icon('shield')+' '+esc(st.label)+'</span><span>'+icon('graduation')+' '+esc(sectionLabel(me.section))+'</span></div><div class="subline"><span>'+icon('ticket')+' '+esc(plan)+'</span></div></div><div class="hero-tag">'+icon('sparkles')+' حسابك الدراسي</div></div></section>'+

$('goSubjects').onclick=function(){location.href='subjects.html'};$('refreshProfile').onclick=load;$('copyCode').onclick=function(){if(code==='—'){toast('مفيش كود متاح للنسخ');return}var done=function(){toast('تم نسخ كود الاشتراك')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(String(code)).then(done).catch(function(){fallbackCopy(code,done)});else fallbackCopy(code,done)};$('logout').onclick=function(){if(!confirm('متأكد إنك عاوز تسجّل الخروج؟'))return;try{localStorage.removeItem(TOKEN_KEY)}catch(e){}try{sessionStorage.removeItem(TOKEN_KEY)}catch(e){}location.replace('index.html')};timerStart()}

function showError(msg,canRetry){clearInterval(timer);$('main').innerHTML='<div class="error"><div style="font-size:38px">'+(canRetry?icon('wifi'):icon('lock'))+'</div><h2>'+(canRetry?'تعذر تحميل بيانات الحساب':'محتاج تسجّل دخولك')+'</h2><p>'+esc(msg)+'</p><div class="actions" style="justify-content:center">'+(canRetry?'<button class="btn primary" id="retry">إعادة المحاولة</button>':'<button class="btn primary" id="login">تسجيل الدخول</button>')+'<button class="btn" id="back">رجوع للمواد</button></div></div>';if($('retry'))$('retry').onclick=load;if($('login'))$('login').onclick=function(){location.href='index.html'};$('back').onclick=function(){location.href='subjects.html'}}
function load(){var t=token();if(!t){showError('مش لاقي جلسة دخول محفوظة على نفس المتصفح. سجّل الدخول الأول، وبعدها افتح صفحة البروفايل.',false);return}$('main').innerHTML='<div class="loading"><div class="loader"></div><b>بنحدّث بياناتك…</b><p style="color:var(--muted);font-size:12px">مش هنخرجك من الحساب لو حصل خطأ اتصال مؤقت</p></div>';fetch(API+'/api/auth/me',{method:'GET',headers:{Accept:'application/json',Authorization:'Bearer '+t},cache:'no-store'}).then(function(r){return r.json().catch(function(){return {}}).then(function(d){if(r.status===401){try{localStorage.removeItem(TOKEN_KEY)}catch(e){}showError('السيرفر أكد إن الجلسة غير صالحة. سجّل الدخول من جديد.',false);return null}if(!r.ok)throw new Error(d.message||('خطأ من السيرفر ('+r.status+')'));return d})}).then(function(d){if(!d)return;if(!d.data)throw new Error('السيرفر مرجعش بيانات الحساب بالشكل المتوقع');render(d.data)}).catch(function(e){showError((e&&e.message)||'حصلت مشكلة اتصال. جرّب تاني.',true)})}
