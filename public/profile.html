<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابي | كورساتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.profile-container { max-width: 900px; margin: 40px auto; padding: 20px; }
.profile-header {
  background: linear-gradient(135deg, var(--panel), var(--bg));
  border: 1px solid var(--line); border-radius: 24px;
  padding: 30px; text-align: center; margin-bottom: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.profile-avatar {
  width: 100px; height: 100px; margin: 0 auto 16px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--orange), var(--orange3));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 2.5rem; font-weight: 900;
  box-shadow: 0 10px 30px rgba(255,107,26,.4);
}
.profile-name { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
.profile-code { color: var(--orange2); font-weight: 800; font-size: 1rem; letter-spacing: 2px; margin-bottom: 20px; }
.profile-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 16px; border-radius: 20px;
  background: rgba(16,185,129,.15); color: var(--mint);
  font-size: 0.85rem; font-weight: 800; border: 1px solid rgba(16,185,129,.3);
}
.profile-badge.warn { background: rgba(251,191,36,.15); color: #fcd34d; border-color: rgba(251,191,36,.3); }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 20px; padding: 24px; text-align: center;
  transition: .3s;
}
.stat-card:hover { border-color: var(--orange); transform: translateY(-4px); }
.stat-icon { font-size: 2rem; margin-bottom: 10px; }
.stat-value { font-size: 1.8rem; font-weight: 900; color: var(--orange2); }
.stat-label { color: var(--muted); font-size: 0.85rem; margin-top: 4px; font-weight: 700; }
.info-card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 20px; padding: 24px;
}
.info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0; border-bottom: 1px solid var(--line);
}
.info-row:last-child { border-bottom: 0; }
.info-row .label { color: var(--muted); font-size: 0.9rem; font-weight: 700; }
.info-row .value { font-weight: 800; color: var(--text); }
.action-buttons { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
.action-btn {
  flex: 1; min-width: 150px; padding: 14px 20px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--panel);
  color: var(--text); font-weight: 800; cursor: pointer;
  transition: .2s; font-family: inherit; font-size: 0.95rem;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.action-btn:hover { border-color: var(--orange); color: var(--orange2); }
.action-btn.danger { color: #ff8a80; }
.action-btn.danger:hover { border-color: #ff8a80; background: rgba(239,68,68,.1); }
.loading-state { text-align: center; padding: 80px 20px; color: var(--muted); }
</style>
</head>
<body>

<header class="nav">
  <div class="container navin">
    <a class="brand" href="subjects.html">
      <span class="logo">🎓</span>
      <span>كورساتك<small>منصة تعليمية</small></span>
    </a>
    <div class="navactions">
      <button class="btn btn-soft" onclick="location.href='subjects.html'">📚 المواد</button>
    </div>
  </div>
</header>

<main class="profile-container" id="app">
  <div class="loading-state">
    <div class="spinner" style="width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;"></div>
    جاري تحميل بيانات حسابك...
  </div>
</main>

<script>
async function loadProfile() {
  const app = document.getElementById('app');
  try {
    const res = await fetch('/api/profile');
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { data = text; }
    if (!res.ok || (data.success === false)) {
      throw new Error(data.message || data.error || 'فشل تحميل البيانات');
    }
    const profile = data.data !== undefined ? data.data : data;
    renderProfile(profile);
  } catch (e) {
    app.innerHTML = `<div class="loading-state">
      <div style="font-size:2rem; margin-bottom:12px;">⚠️</div>
      <b>خطأ في تحميل البروفايل</b><br>
      <span style="font-size:0.9rem; color:var(--muted);">${e.message}</span>
      <div style="margin-top:20px;">
        <button class="action-btn" onclick="loadProfile()">إعادة المحاولة</button>
      </div>
    </div>`;
  }
}

function renderProfile(p) {
  const app = document.getElementById('app');
  const name = p.name || p.fullName || p.studentName || 'طالب';
  const code = p.code || p.subscriptionCode || '—';
  const section = p.section || p.gradeName || 'عام';
  const expiry = p.expiresAt ? new Date(p.expiresAt).toLocaleDateString('ar-EG', {year:'numeric', month:'long', day:'numeric'}) : 'غير محدد';
  
  // حساب الأيام المتبقية
  let daysLeft = '—';
  let statusClass = '';
  let statusText = 'نشط';
  if (p.expiresAt) {
    const diff = new Date(p.expiresAt).getTime() - Date.now();
    const days = Math.ceil(diff / (1000*60*60*24));
    if (days > 7) { daysLeft = days + ' يوم'; statusText = 'نشط'; }
    else if (days > 0) { daysLeft = days + ' يوم'; statusText = 'ينتهي قريباً'; statusClass = 'warn'; }
    else { daysLeft = 'منتهي'; statusText = 'منتهي'; statusClass = 'warn'; }
  }
  
  // إحصائيات المشاهدة
  let watchedCount = 0;
  let inProgressCount = 0;
  let totalMinutes = 0;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith('cstk_w_')) continue;
      try {
        const w = JSON.parse(localStorage.getItem(key) || 'null');
        if (!w) continue;
        if (w.watched || w.percent >= 90) watchedCount++;
        else if (w.currentTime > 0) inProgressCount++;
        totalMinutes += Math.floor((w.currentTime || 0) / 60);
      } catch(e) {}
    }
  } catch(e) {}
  
  app.innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${escape(name).charAt(0)}</div>
      <div class="profile-name">${escape(name)}</div>
      <div class="profile-code">كود: ${escape(code)}</div>
      <span class="profile-badge ${statusClass}">● ${statusText}</span>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-value">${watchedCount}</div>
        <div class="stat-label">فيديو مكتمل</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <div class="stat-value">${inProgressCount}</div>
        <div class="stat-label">فيديو قيد المشاهدة</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏱</div>
        <div class="stat-value">${totalMinutes}</div>
        <div class="stat-label">دقيقة مشاهدة</div>
      </div>
    </div>
    
    <div class="info-card">
      <h3 style="margin-bottom:16px; font-size:1.1rem;">📋 بيانات الحساب</h3>
      <div class="info-row"><span class="label">الاسم</span><span class="value">${escape(name)}</span></div>
      <div class="info-row"><span class="label">الكود</span><span class="value">${escape(code)}</span></div>
      <div class="info-row"><span class="label">الشعبة</span><span class="value">${escape(section)}</span></div>
      <div class="info-row"><span class="label">تاريخ الانتهاء</span><span class="value">${escape(expiry)}</span></div>
      <div class="info-row"><span class="label">الأيام المتبقية</span><span class="value">${daysLeft}</span></div>
    </div>
    
    <div class="action-buttons">
      <button class="action-btn" onclick="location.href='subjects.html'">📚 رجوع للمواد</button>
      <button class="action-btn danger" onclick="doLogout()">🚪 تسجيل الخروج</button>
    </div>
  `;
}

function doLogout() {
  if (!confirm('متأكد إنك عايز تسجّل الخروج؟')) return;
  localStorage.removeItem('cstk_tok');
  window.location.href = 'index.html';
}

function escape(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

if (!localStorage.getItem('cstk_tok')) {
  window.location.href = 'index.html';
} else {
  loadProfile();
}
</script>

</body>
</html>
