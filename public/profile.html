<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل المحاضرة</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <style>
        body { margin:0; background:#000; font-family: Arial, sans-serif; overflow: hidden; }
        #video-container { position: relative; width: 100%; height: 100vh; }
        #video { width: 100%; height: 100%; object-fit: contain; }
        .error-box { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; text-align: center; padding: 20px; 
            background: rgba(255,0,0,0.2); border: 1px solid #f44336; border-radius: 8px;
            font-size: 18px; font-family: sans-serif; direction: rtl; max-width: 90%;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="video" autoplay playsinline controls></video>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls;

        // دالة تحميل أدوات فك التشفير الخاصة بـ Stream-Weave
        function loadSWPlayer() {
            return new Promise((resolve, reject) => {
                if (window.DecryptionUtils) return resolve(window.DecryptionUtils);
                const script = document.createElement('script');
                script.src = "https://player.stream-weave.com/assets/player.js?v=1.1.1";
                script.onload = () => {
                    if (window.DecryptionUtils) resolve(window.DecryptionUtils);
                    else reject(new Error("لم يتم العثور على أدوات فك التشفير في player.js"));
                };
                script.onerror = () => reject(new Error("فشل تحميل سكريبت player.js"));
                document.head.appendChild(script);
            });
        }

        async function playVideo(lectureId, videoId) {
            try {
                // 1. طلب البيانات من السيرفر بتاعك
                const res = await fetch(`/api/video/${lectureId}/session`);
                
                // فحص إذا كان الرد JSON
                const contentType = res.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("السيرفر رجع استجابة غير صالحة. تأكد من رفع server.js الجديد.");
                }

                // قراءة البيانات
                const data = await res.json();

                // إذا كان هناك خطأ (مثل انتهاء صلاحية التوكن)
                if (!res.ok) {
                    throw new Error(`خطأ ${res.status}: ${data.message || data.error || 'غير معروف'}`);
                }

                const { token, stream_url, video_id } = data;
                
                // تجهيز رابط البث
                const urlObj = new URL(stream_url);
                const path = urlObj.pathname.replace('/api/v1/', '');
                const proxyUrl = `/api/stream?path=${encodeURIComponent(path)}&t=${token}`;

                // 2. تحميل أدوات فك التشفير
                const crypto = await loadSWPlayer();

                // 3. تشغيل HLS
                if (Hls.isSupported()) {
                    hls = new Hls({
                        // اعتراض طلب المفتاح وفك تشفيره
                        keyLoader: function(keyInfo, keyXhr, resp) {
                            fetch(keyInfo.url)
                                .then(r => r.arrayBuffer())
                                .then(async buffer => {
                                    const result = await crypto.decryptPlaybackKey(new Uint8Array(buffer), video_id);
                                    if (result && result.key) {
                                        resp.data = result.key.buffer; 
                                        keyLoader(keyInfo, resp); // نجاح
                                    } else {
                                        keyLoader(keyInfo, resp, new Error("فشل فك تشفير المفتاح"));
                                    }
                                })
                                .catch(err => keyLoader(keyInfo, resp, err));
                        }
                    });

                    hls.loadSource(proxyUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                } else {
                    video.src = proxyUrl;
                }
            } catch (e) {
                console.error(e);
                // عرض الخطأ الحقيقي على الشاشة
                document.body.innerHTML = `<div class="error-box">❌ فشل التشغيل<br><br><b>${e.message}</b></div>`;
            }
        }

        // استخراج الـ Parameters من الرابط (مع دعم الأخطاء الإملائية)
        const params = new URLSearchParams(window.location.search);
        const lectureId = params.get('lecturedId') || params.get('lectureId');
        const videoId = params.get('videold') || params.get('videoId');

        if (lectureId && videoId) {
            playVideo(lectureId, videoId);
        } else {
            document.body.innerHTML = '<div class="error-box">❌ لم يتم العثور على lectureId أو videoId في رابط الصفحة</div>';
        }
    </script>
</body>
</html>
