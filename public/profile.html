<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ملفي — ثانوية World</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo" onclick="window.location.href='/subjects.html'" style="cursor:pointer">ثانوية World</div>
    <a href="/subjects.html" style="color:var(--accent);font-size:0.88rem;font-weight:600;text-decoration:none;padding:8px 14px;background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);border-radius:8px">رجوع</a>
  </header>

  <main id="app">
    <div class="loading">جاري التحميل...</div>
  </main>

  <script>
    (function () {
      var tok = null;
      try { tok = localStorage.getItem("cstk_tok") || sessionStorage.getItem("cstk_tok"); } catch (e) {}
      if (!tok) { window.location.href = "/index.html"; return; }

      var app = document.getElementById("app");
      var code = "—";
      try { code = localStorage.getItem("cstk_code") || "—"; } catch (e) {}

      var done = 0, active = 0, minutes = 0;
      try {
        for (var k in localStorage) {
          if (!k || k.indexOf("cstk_w_") !== 0) continue;
          try {
            var p = JSON.parse(localStorage.getItem(k) || "null");
            if (!p) continue;
            if (p.watched || p.percent >= 90) done++;
            else if (p.percent > 0) active++;
            if (p.currentTime) minutes += Math.floor(p.currentTime / 60);
          } catch (_) {}
        }
      } catch (_) {}

      app.innerHTML =
        '<h1>ملفي الشخصي</h1>' +
        '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:24px">' +
          '<div class="card" style="padding:20px;cursor:default">' +
            '<div class="title">👤 الاسم</div>' +
            '<div class="meta" style="font-size:1.1rem;color:var(--text);margin-top:8px">طالب</div>' +
          '</div>' +
          '<div class="card" style="padding:20px;cursor:default">' +
            '<div class="title">🔑 كود الاشتراك</div>' +
            '<div class="meta" style="font-size:1.1rem;color:var(--accent);margin-top:8px;letter-spacing:2px">' + code + '</div>' +
          '</div>' +
          '<div class="card" style="padding:20px;cursor:default">' +
            '<div class="title">✅ فيديو مكتمل</div>' +
            '<div class="meta" style="font-size:1.5rem;color:var(--success);margin-top:8px;font-weight:700">' + done + '</div>' +
          '</div>' +
          '<div class="card" style="padding:20px;cursor:default">' +
            '<div class="title">▶️ فيديو بدأته</div>' +
            '<div class="meta" style="font-size:1.5rem;color:var(--accent-light);margin-top:8px;font-weight:700">' + active + '</div>' +
          '</div>' +
          '<div class="card" style="padding:20px;cursor:default">' +
            '<div class="title">⏱️ دقائق المشاهدة</div>' +
            '<div class="meta" style="font-size:1.5rem;color:var(--accent);margin-top:8px;font-weight:700">' + minutes + '</div>' +
          '</div>' +
        '</div>' +
        '<button class="btn" style="max-width:300px" onclick="window.location.href=\'/subjects.html\'"><span>📚</span><span>رجوع للمواد</span></button>' +
        '<button class="btn" style="max-width:300px;margin-top:10px;color:#fca5a5" onclick="doLogout()"><span>🚪</span><span>تسجيل الخروج</span></button>';

      window.doLogout = function () {
        try {
          localStorage.removeItem("cstk_tok");
          localStorage.removeItem("cstk_code");
          localStorage.removeItem("cstk_me");
        } catch (e) {}
        window.location.href = "/index.html";
      };
    })();
  </script>
</body>
</html>
