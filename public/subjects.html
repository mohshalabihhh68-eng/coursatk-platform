<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#060910"/>
<title>ثانوية club — المواد الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/styles.css"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<style>
.ctrl-row svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ctrl-btn svg.f{fill:currentColor;stroke:none}
.topbar-actions{display:flex;align-items:center;gap:8px}
</style>
</head>
<body data-theme="dark">

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="#" onclick="event.preventDefault();goHome()">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5"/></svg>
      </div>
      <div class="brand-text"><b>ثانوية club</b><small>منصتك التعليمية</small></div>
    </a>
    <div class="topbar-actions">
      <a class="profile-link" href="/profile.html">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        ملفي
      </a>
      <button class="icon-btn" id="theme-toggle" title="تبديل الثيم">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading-screen">
    <div class="spinner-ring"></div>
    <span style="color:var(--muted);font-size:13px;font-weight:700;margin-top:4px">جاري التحميل...</span>
  </div>
</main>

<div id="player-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <button class="back-modal-btn" onclick="closePlayer()">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        رجوع
      </button>
      <div class="modal-title-group">
        <h3 id="player-title">المحاضرة</h3>
        <p>ثانوية club</p>
      </div>
      <div class="modal-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <div class="player-wrap" id="player-wrap">
      <video id="video" playsinline></video>
      <div class="click-layer" id="click-layer"></div>

      <div id="player-status" class="player-status">
        <div class="spinner-ring"></div>
        <span>جاري التشغيل...</span>
      </div>

      <div id="seek-indicator" class="seek-indicator hidden">+10s</div>

      <div class="controls-bar" id="controls-bar">
        <div class="prog-wrap" id="prog-bar" onclick="seekVideo(event)">
          <div class="prog-rail"><div class="prog-filled" id="prog-filled"></div></div>
        </div>
        <div class="ctrl-row">
          <div class="ctrl-left">
            <button class="ctrl-btn" onclick="togglePlay()">
              <svg id="play-icon" viewBox="0 0 24 24" class="f"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pause-icon" viewBox="0 0 24 24" class="f hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <div class="vol-wrap">
              <button class="ctrl-btn" onclick="toggleMute()">
                <svg id="vol-icon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              </button>
              <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1"/>
            </div>
            <span class="time-txt" id="time-disp">00:00 / 00:00</span>
          </div>
          <div class="ctrl-right">
            <div class="dropdown">
              <button class="ctrl-btn ctrl-text-btn" id="speed-btn" onclick="toggleDropdown('speed-menu')">1x</button>
              <div class="dropdown-panel hidden" id="speed-menu">
                <button onclick="setSpeed(0.5,this)">0.5x</button>
                <button onclick="setSpeed(0.75,this)">0.75x</button>
                <button onclick="setSpeed(1,this)" class="active">1x</button>
                <button onclick="setSpeed(1.25,this)">1.25x</button>
                <button onclick="setSpeed(1.5,this)">1.5x</button>
                <button onclick="setSpeed(2,this)">2x</button>
              </div>
            </div>
            <div class="dropdown">
              <button class="ctrl-btn ctrl-text-btn" id="quality-btn" onclick="toggleDropdown('quality-menu')">جودة</button>
              <div class="dropdown-panel hidden" id="quality-menu">
                <button onclick="setQuality(-1,this)" class="active">تلقائي</button>
              </div>
            </div>
            <button class="ctrl-btn" onclick="toggleFullscreen()">
              <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/app.js" defer></script>
</body>
</html>
