<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المواد | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:#121a2b;--card-hover:#182338;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.12);--blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}
button{font:inherit;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Navbar */
.app-nav{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer}
.brand img{width:38px;height:38px;border-radius:12px;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:2px}
.profile-wrap{position:relative;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:800;font-size:12px;color:var(--ink);transition:.2s}
.profile-btn:hover{background:var(--card-hover)}
.profile-btn .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}

/* Content */
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer;margin-bottom:14px;color:var(--ink);transition:.2s}
.back-btn:hover{background:var(--card-hover);border-color:rgba(59,130,246,.3)}
.page-head{margin-bottom:28px;animation:fadeUp .4s ease}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.12);color:var(--blue2);border:1px solid rgba(59,130,246,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.page-head h1{margin:0;font-size:28px;font-weight:900}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:14px}

/* Grid & Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;cursor:pointer;transition:all .3s cubic-bezier(0.4,0,0.2,1);animation:fadeUp .45s ease both;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-8px);border-color:rgba(59,130,246,.5);box-shadow:0 20px 40px rgba(0,0,0,.4),0 0 20px rgba(59,130,246,.1)}

/* تصميم الأيقونة والخلفية الملونة */
.card-icon-area{
  width:100%;
  height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.card-icon-area::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 70%);
  z-index: 1;
}
.card-icon-area svg{
  width:70px;
  height:70px;
  stroke-width:1.5;
  z-index:2;
  opacity:0.9;
  transition:transform .3s ease;
  color: #fff;
}
.card:hover .card-icon-area svg{
  transform:scale(1.1) rotate(-5deg);
}
.card-body{padding:20px;display:flex;flex-direction:column;flex:1;position:relative;background:var(--card);z-index:3}
.card-body h3{margin:0;font-size:18px;font-weight:900;margin-bottom:4px}
.card-body .sub{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:16px}

/* Modern Button (معدل) */
.action-btn{
  width:100%;
  padding:12px;
  border:0;
  border-radius:14px;
  font-weight:800;
  font-size:14px;
  background:linear-gradient(135deg,var(--blue),var(--blue3)); /* لون أزرق ثابت */
  color:#fff; /* لون النص أبيض */
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .2s ease;
  margin-top:auto;
  box-shadow: 0 4px 12px rgba(37,99,235,.2); /* ظل خفيف */
}
.action-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(37,99,235,.4); /* ظل أقوى */
  filter: brightness(1.1); /* سطوع أعلى شوية */
}
.action-btn svg{width:16px;height:16px;fill:currentColor;transition:transform .2s}
.action-btn:hover svg{transform:translateX(-4px)}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}

@media(max-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.card-icon-area{height:120px}.card-icon-area svg{width:50px;height:50px}.card-body{padding:16px}.card-body h3{font-size:16px}}
</style>
</head>
<body>
  <header class="app-nav"><div class="app-nav-in">
    <div class="brand" id="brand-home"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M32 14 8 26l24 12 24-12z' fill='%23fff'/%3E%3C/svg%3E" alt=""><div>ثانوية club<small>منصة الثانوية العامة</small></div></div>
    <div class="profile-wrap"><button type="button" class="profile-btn" id="profile-btn"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button></div>
  </div></header>

  <main class="wrap" id="main"><div class="loading"><div class="spinner"></div><p>جاري تحميل المواد...</p></div></main>

<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'cstk_tok', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const subjectId = qs.get('subjectId') || '4';

const api = async (path, opts = {}) => {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
  return data.data;
};
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// دالة لإرجاع الأيقونة واللون حسب اسم المادة
function getSubjectStyle(name) {
  const n = String(name).toLowerCase();
  
  if (n.includes('عربي') || n.includes('عربية') || n.includes('لغة')) {
    return { 
      bg: 'linear-gradient(135deg, #ef4444, #991b1b)', 
      svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>` 
    };
  }
  if (n.includes('english') || n.includes('إنجليزي') || n.includes('انجليزي')) {
    return { 
      bg: 'linear-gradient(135deg, #8b5cf6, #4c1d95)', 
      svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>` 
    };
  }
  if (n.includes('فيزياء') || n.includes('فيزيا')) {
    return { 
      bg: 'linear-gradient(135deg, #3b82f6, #1e3a8a)', 
      svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19 12c0 3.9-3.1 7-7 7s-7-3.1-7-7 3.1-7 7-7 7 3.1 7 7z"/><path d="M12 5c3.9 0 7 3.1 7 7s-3.1 7-7 7-7-3.1-7-7 3.1-7 7-7z"/></svg>` 
    };
  }
  if (n.includes('كيمياء') || n.includes('كيميا')) {
    return { 
      bg: 'linear-gradient(135deg, #f97316, #9a3412)', 
      svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 2v7.31"/><path d="M14 9.3V1.99"/><path d="M8.5 2h7"/><path d="M14 9.3a6.5 6.5 0 1 1-4 0"/><path d="M5.52 16h12.96"/></svg>` 
    };
  }
  if (n.includes('أحياء') || n.includes('احياء')) {
    return { 
      bg: 'linear-gradient(135deg, #10b981, #064e3b)', 
      svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>` 
    };
  }
  if (n.includes('رياضيات') || n.includes('رياضة') || n.includes('ماث') || n.includes('math')) {
    return { 
      bg: 'linear-gradient(135deg, #ec4899, #831843)', 
      svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 5 5 19"/><path d="M6.5 6.5h11"/><path d="M6.5 17.5h11"/><path d="M19 5 5 5"/></svg>` 
    };
  }
  
  // الافتراضي
  return { 
    bg: 'linear-gradient(135deg, #64748b, #334155)', 
    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>` 
  };
}

async function load() {
  try {
    const subjects = await api('/api/subjects/' + subjectId);
    if (!subjects || !subjects.length) { $('main').innerHTML = '<div style="text-align:center;padding:50px;color:var(--muted)">لا يوجد مواد متاحة.</div>'; return; }
    
    let html = `<button class="back-btn" onclick="history.back()">← رجوع</button>
    <div class="page-head">
      <div class="badge">المواد الدراسية</div>
      <h1>موادك المتاحة</h1>
      <p>اختار المادة لعرض المدرسين</p>
    </div>
    <div class="grid">`;
    
    subjects.forEach(s => {
      const style = getSubjectStyle(s.name);
      
      html += `<div class="card" onclick="window.location.href='teachers.html?subjectId=${s.id}&subjectName=${encodeURIComponent(s.name)}'">
        <div class="card-icon-area" style="background: ${style.bg}">
          ${style.svg}
        </div>
        <div class="card-body">
          <h3>${esc(s.name)}</h3>
          <div class="sub">مادة دراسية</div>
          <button class="action-btn">
            عرض المدرسين
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>`;
    });
    html += '</div>'; $('main').innerHTML = html;
  } catch (e) { $('main').innerHTML = `<div style="text-align:center;color:#ff5252;padding:50px;">خطأ: ${e.message}</div>`; }
}

async function loadProfile() { try { const me = await api('/api/profile'); $('nav-name').textContent = me.name || 'طالب'; $('nav-av').textContent = (me.name || 'ط').charAt(0); } catch (e) {} }
$('brand-home').onclick = () => window.location.href = 'index.html';
load(); loadProfile();
})();
</script>
</body>
</html>
