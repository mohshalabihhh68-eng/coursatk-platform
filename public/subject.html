<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <title>ثانوية club — المواد الدراسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7" defer></script>

  <style>
    /* === subjects-page specific === */
    .profile-link {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 11px;
      font-size: 12px; font-weight: 800;
      transition: .2s; text-decoration: none;
    }
    .profile-link:hover { border-color: var(--line2); background: rgba(255,255,255,.09); }
    .profile-link svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    /* === modal === */
    .player-modal-body {
      position: relative;
    }
    .modal-header .back-modal-btn {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 9px 15px; border-radius: 11px;
      font-size: 13px; font-weight: 800;
      transition: .2s; flex-shrink: 0;
    }
    .modal-header .back-modal-btn:hover { background: rgba(255,255,255,.1); }
    .modal-header .back-modal-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .ctrl-row svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
    .ctrl-btn svg.f { fill: currentColor; }
  </style>
</head>
<body data-theme="dark">

<!-- ==================== Topbar ==================== -->
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/" onclick="event.preventDefault();goHome()">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Z"/><path d="M6 10v5c3.5 3 8.5 3 12 0v-5"/></svg>
      </div>
      <div class="brand-text">
        <b>ثانوية club</b>
        <small>منصتك التعليمية</small>
      </div>
    </a>
    <div style="display:flex;align-items:center;gap:10px">
      <a class="profile-link" href="/profile.html">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        ملفي
      </a>
      <button class="icon-btn" id="theme-toggle" title="تبديل الثيم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- ==================== Main App ==================== -->
<main id="app">
  <div class="loading-screen">
    <div class="spinner-ring"></div>
    <span style="color:var(--muted);font-size:13px;font-weight:700">جاري التحميل...</span>
  </div>
</main>

<!-- ==================== Player Modal ==================== -->
<div id="player-modal" class="modal hidden">
  <div class="modal-box player-modal-body">

    <div class="modal-header">
      <button class="back-modal-btn" onclick="closePlayer()">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        رجوع
      </button>
      <div class="modal-title-group">
        <h3 id="player-title">المحاضرة</h3>
        <p>ثانوية club</p>
      </div>
      <div class="modal-icon">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>

    <!-- Player -->
    <div class="player-wrap" id="player-wrap">
      <video id="video" playsinline></video>
      <div class="click-layer" id="click-layer"></div>

      <!-- Status overlay -->
      <div id="player-status" class="player-status">
        <div class="spinner-ring"></div>
        <span>جاري التشغيل...</span>
      </div>

      <!-- Seek indicator -->
      <div id="seek-indicator" class="seek-indicator hidden">+10s</div>

      <!-- Controls -->
      <div class="controls-bar" id="controls-bar">
        <!-- Progress -->
        <div class="prog-wrap" id="prog-bar" onclick="seekVideo(event)">
          <div class="prog-rail" id="prog-rail">
            <div class="prog-filled" id="prog-filled"></div>
          </div>
        </div>

        <!-- Buttons row -->
        <div class="ctrl-row">
          <div class="ctrl-left">
            <!-- Play/Pause -->
            <button class="ctrl-btn" onclick="togglePlay()">
              <svg id="play-icon" viewBox="0 0 24 24" class="f"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pause-icon" viewBox="0 0 24 24" class="f hidden"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <!-- Volume -->
            <div class="vol-wrap">
              <button class="ctrl-btn" onclick="toggleMute()">
                <svg id="vol-icon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              </button>
              <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1" />
            </div>
            <span class="time-txt" id="time-disp">00:00 / 00:00</span>
          </div>
          <div class="ctrl-right">
            <!-- Speed -->
            <div class="dropdown">
              <button class="ctrl-btn ctrl-text-btn" id="speed-btn" onclick="toggleDropdown('speed-menu')">1x</button>
              <div class="dropdown-panel hidden" id="speed-menu">
                <button onclick="setSpeed(0.5,this)">0.5x</button>
                <button onclick="setSpeed(0.75,this)">0.75x</button>
                <button onclick="setSpeed(1,this)" class="active">1x</button>
                <button onclick="setSpeed(1.25,this)">1.25x</button>
                <button onclick="setSpeed(1.5,this)">1.5x</button>
                <button onclick="setSpeed(2,this)">2x</button>
              </div>
            </div>
            <!-- Quality -->
            <div class="dropdown">
              <button class="ctrl-btn ctrl-text-btn" id="quality-btn" onclick="toggleDropdown('quality-menu')">جودة</button>
              <div class="dropdown-panel hidden" id="quality-menu">
                <button onclick="setQuality(-1,this)" class="active">تلقائي</button>
              </div>
            </div>
            <!-- Fullscreen -->
            <button class="ctrl-btn" onclick="toggleFullscreen()">
              <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
          </div>
        </div>
      </div><!-- /controls-bar -->
    </div><!-- /player-wrap -->

  </div>
</div>

<script src="/app.js" defer></script>
</body>
</html>
