<!DOCTYPE html>
<!-- ثانوية club | v2.4 -->
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#070b14">
<title>المواد الدراسية | ثانوية club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M32 14 8 26l24 12 24-12z' fill='%23fff'/%3E%3Cpath d='M18 33v10c0 4 7 8 14 8s14-4 14-8V33l-14 7z' fill='%23bfdbfe'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b14; --bg2:#0c1220; --card:#121a2b; --card2:#182234;
  --ink:#eef2ff; --muted:#8b9bb8; --line:rgba(148,163,184,.12);
  --blue:#3b82f6; --blue2:#60a5fa; --blue3:#2563eb;
  --red:#ff3b30; --green:#34d399;
  --shadow:0 24px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes cardShine{0%{transform:translateX(-120%) skewX(-15deg)}100%{transform:translateX(220%) skewX(-15deg)}}
@keyframes markMove{
  0%{top:14%;left:10%;opacity:.4}
  25%{top:42%;left:58%;opacity:.55}
  50%{top:68%;left:22%;opacity:.35}
  75%{top:28%;left:72%;opacity:.5}
  100%{top:14%;left:10%;opacity:.4}
}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(59,130,246,.45)}70%{box-shadow:0 0 0 14px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}

svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.ic-lg{width:26px;height:26px}
svg.ic-fill{width:20px;height:20px;fill:currentColor;stroke:none}

/* LOGIN */
#login{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:
  radial-gradient(800px 420px at 85% -10%,rgba(59,130,246,.18),transparent 55%),
  radial-gradient(500px 320px at 5% 110%,rgba(37,99,235,.1),transparent 50%),
  var(--bg)}
.login-card{
  width:100%;max-width:400px;background:linear-gradient(180deg,var(--card),var(--bg2));
  border:1px solid var(--line);border-radius:28px;padding:32px 26px;box-shadow:var(--shadow);
  animation:scaleIn .4s ease;position:relative;overflow:hidden;
}
.login-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--blue2),var(--blue3));
}
.login-logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;overflow:hidden;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.login-logo img{width:100%;height:100%;object-fit:contain}
.login-card h1{margin:0;text-align:center;font-size:22px;font-weight:900}
.login-card .sub{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 22px;line-height:1.6}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}
.field input{
  width:100%;border:1px solid var(--line);background:var(--bg);border-radius:14px;
  padding:14px 16px;outline:none;font-weight:800;text-align:center;font-size:20px;letter-spacing:.28em;transition:.2s;
}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(59,130,246,.15)}
.field input.plain{font-size:13px;letter-spacing:0;text-align:right;font-weight:600}
.btn{
  border:0;border-radius:14px;padding:13px 16px;font-weight:900;font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.2s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;width:100%;box-shadow:0 12px 32px rgba(37,99,235,.35)}
.btn-primary:hover{box-shadow:0 16px 40px rgba(37,99,235,.45);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:9px 12px;font-size:12px;border-radius:12px}
.err{color:#ff8a80;font-size:12px;text-align:center;min-height:18px;margin-top:10px;font-weight:700}
.api-toggle{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;cursor:pointer;font-weight:700}
.api-box{display:none;margin-top:8px}.api-box.show{display:block}

/* APP */
#app{display:none;min-height:100vh;animation:fadeIn .35s ease}
.app-nav{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer}
.brand img{width:36px;height:36px;border-radius:11px}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.profile-wrap{position:relative;margin-right:auto}
.profile-btn{
  display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);
  border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:800;font-size:12px;transition:.2s;
}
.profile-btn:hover{border-color:rgba(59,130,246,.4)}
.profile-btn .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.profile-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:none;z-index:50;animation:scaleIn .2s ease}
.profile-menu.open{display:block}
.profile-menu button{width:100%;text-align:right;border:0;background:transparent;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.profile-menu button:hover{background:rgba(255,255,255,.04)}
.profile-menu button.danger{color:#ff8a80}

.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.page-head{margin-bottom:22px;animation:fadeUp .4s ease}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.12);color:var(--blue2);border:1px solid rgba(59,130,246,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.page-head h1{margin:0;font-size:26px;font-weight:900}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer;margin-bottom:14px;color:var(--ink);transition:.2s}
.back-btn:hover{border-color:rgba(59,130,246,.35);background:var(--card2)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:20px;align-items:stretch}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;
  cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;
  animation:fadeUp .45s ease both;box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.card:hover{transform:translateY(-8px) scale(1.01);border-color:rgba(59,130,246,.4);box-shadow:0 24px 50px rgba(37,99,235,.18)}
.card::after{
  content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.06) 50%,transparent 60%);
  transform:translateX(-120%) skewX(-15deg);pointer-events:none;
}
.card:hover::after{animation:cardShine .7s ease}
.card-img{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 20% 20%,rgba(96,165,250,.22),transparent 36%),radial-gradient(circle at 80% 85%,rgba(139,92,246,.2),transparent 38%),linear-gradient(135deg,#101b31,#0b1220);overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover .card-img img{transform:scale(1.08)}
.card-img .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--muted)}
.badge-live{position:absolute;top:10px;right:10px;background:rgba(16,185,129,.18);color:var(--green);border:1px solid rgba(52,211,153,.25);border-radius:999px;padding:4px 10px;font-size:10px;font-weight:800;display:inline-flex;align-items:center;gap:5px;backdrop-filter:blur(8px)}
.badge-live i{width:6px;height:6px;border-radius:50%;background:var(--green);display:block}
.card-body{padding:16px 16px 17px;display:flex;flex-direction:column;min-height:145px}
.card-body h3{margin:0;font-size:clamp(14px,1.3vw,17px);font-weight:900;line-height:1.5;min-height:2.8em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted);font-weight:700;min-height:20px}
.card-btn{width:100%;margin-top:auto;padding-top:12px;border:0;border-radius:12px;padding:11px;font-weight:900;font-size:12px;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.card:hover .card-btn{box-shadow:0 8px 22px rgba(37,99,235,.35)}

.vlist{display:flex;flex-direction:column;gap:10px}
.vcard{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:.25s;animation:fadeUp .35s ease both}
.vcard:hover{border-color:rgba(59,130,246,.4);background:var(--card2);transform:translateX(-4px)}
.vthumb{width:96px;height:64px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;color:var(--blue2);flex-shrink:0;position:relative;overflow:hidden}
.vthumb .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.vthumb .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.vbody{flex:1;min-width:0}
.vtitle{font-size:13px;font-weight:800;line-height:1.35}
.vmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{padding:3px 8px;border-radius:8px;font-size:10px;font-weight:800;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line)}
.tag.g{background:rgba(52,211,153,.12);color:var(--green);border-color:rgba(52,211,153,.2)}
.tag.o{background:rgba(255,59,48,.12);color:#ff8a80;border-color:rgba(255,59,48,.2)}

.profile-card{max-width:460px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 22px;box-shadow:var(--shadow);animation:scaleIn .35s ease}
.profile-card .big-av{width:68px;height:68px;border-radius:20px;margin:0 auto 12px;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900;animation:pulseRing 2.4s infinite}
.profile-card h2{margin:0;text-align:center;font-size:20px;font-weight:900}
.profile-card .sub{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 16px}
.timer-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.timer-cell{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.timer-cell b{display:block;font-size:20px;font-weight:900;color:var(--blue2);font-variant-numeric:tabular-nums}
.timer-cell span{font-size:10px;color:var(--muted);font-weight:800}
.info-row{display:flex;justify-content:space-between;padding:11px 12px;background:var(--bg2);border-radius:12px;border:1px solid var(--line);margin-bottom:8px;font-size:13px}
.info-row span{color:var(--muted);font-weight:700}

.state{text-align:center;padding:48px 16px;color:var(--muted)}
.state h3{margin:10px 0 6px;color:var(--ink);font-weight:900}
.skel{border-radius:22px;height:250px;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:shimmer 1.2s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}


.club{color:var(--blue2)}
.ver{text-align:center;color:var(--muted);font-size:11px;font-weight:700;margin-top:16px;opacity:.7}
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;font-size:12px;font-weight:800}
.crumbs .back-btn{margin:0 0 0 6px}.crumbs a{color:var(--muted);cursor:pointer}.crumbs a:hover{color:var(--blue2)}.crumbs i{color:var(--muted);font-style:normal}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:12px;color:var(--muted);font-weight:700}.chip b{color:var(--blue2);font-size:14px;margin-left:3px}
.tip{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(37,99,235,.05));border:1px solid rgba(59,130,246,.22);border-radius:16px;padding:12px 14px;margin-bottom:20px;animation:fadeUp .45s ease}.tip p{margin:0;font-size:13px;font-weight:700;line-height:1.6}
.sec-title{font-weight:900;font-size:16px;margin:6px 0 14px}
.resume{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:20px;cursor:pointer;transition:.2s}.resume:hover{border-color:rgba(59,130,246,.45)}
.rplay{width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex-shrink:0}.resume>div:last-child{flex:1;min-width:0}
.resume small{display:block;color:var(--muted);font-size:11px;font-weight:700}.resume b{font-size:13px}
.rbar{height:4px;background:rgba(255,255,255,.1);border-radius:9px;margin-top:7px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--blue2)}
.vnum{position:absolute;top:4px;right:5px;font-size:10px;font-weight:900;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px;color:#fff}
.profile-card{max-width:520px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.pstat{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 4px;text-align:center}.pstat b{display:block;font-size:20px;font-weight:900}.pstat span{font-size:10px;color:var(--muted);font-weight:800}
.st{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11px;font-weight:800;background:rgba(52,211,153,.14);color:var(--green)}.st.w{background:rgba(250,204,21,.14);color:#facc15}.st.o{background:rgba(255,59,48,.14);color:#ff8a80}
.acc-btns{display:grid;gap:8px;margin-top:14px}.acc-btns .btn{width:100%}
.copy{border:0;background:rgba(59,130,246,.15);color:var(--blue2);border-radius:8px;padding:3px 9px;font:800 11px Cairo;cursor:pointer;margin-right:8px}
.ph svg{opacity:.6}
/* PLAYER */
#player{display:none;position:fixed;inset:0;z-index:100;background:#000}#player.open{display:block;animation:fadeIn .25s}
.pshell{position:absolute;inset:0;direction:ltr;background:#000;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none}
.pshell video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.ptap{position:absolute;inset:0;z-index:5}
.pmark{position:absolute;z-index:6;pointer-events:none;top:20%;left:12%;direction:rtl;white-space:nowrap;font-weight:800;font-size:clamp(11px,1.6vw,15px);color:rgba(255,255,255,.45);text-shadow:0 1px 4px rgba(0,0,0,.8);transition:top 9s ease-in-out,left 9s ease-in-out}
.ptop,.pcenter,.pctrl{opacity:0;transition:opacity .3s}.pshell.show-ui .ptop,.pshell.show-ui .pcenter,.pshell.show-ui .pctrl{opacity:1}
.pshell:not(.show-ui) .ptop,.pshell:not(.show-ui) .pctrl,.pshell:not(.show-ui) .pcenter button{pointer-events:none}
.pshell:not(.show-ui){cursor:none}
.ptop{position:absolute;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 14px 28px;background:linear-gradient(rgba(0,0,0,.85),transparent)}
.ptitle{flex:1;font-weight:800;font-size:14px;unicode-bidi:plaintext;text-align:start;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.plive{font-size:11px;font-weight:900;background:rgba(59,130,246,.2);color:var(--blue2);border-radius:99px;padding:4px 10px}
.ib{width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;transition:.15s}.ib:hover{background:rgba(255,255,255,.22)}
.ib small{position:absolute;font-size:8px;font-weight:900;top:50%;left:50%;transform:translate(-50%,-38%)}
.pcenter{position:absolute;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;gap:clamp(22px,9vw,70px);pointer-events:none}
.pcenter .ib{width:54px;height:54px}
.bigplay{width:74px;height:74px;border:0;border-radius:50%;background:#3b82f6;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 30px rgba(59,130,246,.5);transition:.2s}.bigplay:hover{transform:scale(1.08)}
.pshell:not(.started) .skipb{display:none}
.pctrl{position:absolute;left:0;right:0;bottom:0;z-index:15;padding:34px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.9))}
.seekwrap{position:relative;height:22px;cursor:pointer;touch-action:none;display:flex;align-items:center}
.rail{position:relative;width:100%;height:4px;border-radius:9px;background:rgba(255,255,255,.22);transition:height .12s}.seekwrap:hover .rail{height:6px}
.rail i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;width:0}#pbuf{background:rgba(255,255,255,.32)}#pplayed{background:#3b82f6}
#pknob{position:absolute;top:50%;left:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(59,130,246,.35);transform:scale(0);transition:transform .15s}.seekwrap:hover #pknob,.seekwrap.drag #pknob{transform:scale(1)}
.ptip{position:absolute;bottom:26px;left:0;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:3px 8px;border-radius:6px;font-size:11px;font-weight:800;opacity:0;pointer-events:none}.seekwrap:hover .ptip{opacity:1}
.prow{display:flex;align-items:center;gap:2px}.prow .ib{background:transparent;width:40px;height:40px}.prow .ib:hover{background:rgba(255,255,255,.14)}
.vol{display:flex;align-items:center}.vol input{width:0;opacity:0;transition:.2s;-webkit-appearance:none;height:3px;border-radius:9px;background:rgba(255,255,255,.35);cursor:pointer}.vol:hover input{width:74px;opacity:1;margin-right:6px}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.ptime{font-size:12px;font-weight:700;padding:0 8px;font-variant-numeric:tabular-nums;opacity:.9}.sp{flex:1}
.pmenu{position:absolute;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:20;min-width:230px;max-width:90vw;background:rgba(18,26,43,.97);border:1px solid var(--line);border-radius:16px;padding:12px;display:none;direction:rtl}.pmenu.open{display:block;animation:scaleIn .15s}
.pmenu h4{margin:4px 4px 8px;font-size:11px;color:var(--muted)}.opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.opts button{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;border-radius:10px;padding:6px 11px;font:800 12px Cairo;cursor:pointer}.opts button.on{background:#3b82f6;border-color:#3b82f6}
.ploading{position:absolute;inset:0;z-index:11;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;font-size:13px;font-weight:700}
.spinner{width:42px;height:42px;border:3px solid rgba(255,255,255,.15);border-top-color:#3b82f6;border-radius:50%;animation:spin .7s linear infinite}

  $("pmark").textContent=((m.name||"")+(m.code?" • "+m.code:"")).trim();
  $("app").style.display="none";$("player").classList.add("open");document.body.style.overflow="hidden";sh.classList.remove("started");sh.classList.add("show-ui");mn.classList.remove("open");
  function mark(){var e=$("pmark");e.style.top=(12+Math.random()*66)+"%";e.style.left=(6+Math.random()*52)+"%"}
  mark();P.mv=setInterval(mark,15000);
  function ui(){sh.classList.add("show-ui");clearTimeout(P.ui);P.ui=setTimeout(function(){if(P.started&&!v.paused&&!mn.classList.contains("open"))sh.classList.remove("show-ui")},3000)}
  function setBar(r){$("pplayed").style.width=r*100+"%";$("pknob").style.left=r*100+"%"}
  function dur(){var d=v.duration;return isFinite(d)&&d>0?d:P.dur}
  function buf(){var b=v.buffered,d=dur(),t=v.currentTime,e=0;for(var i=0;i<b.length;i++)if(b.start(i)<=t+.5&&b.end(i)>=t)e=b.end(i);$("pbuf").style.width=d>0?e/d*100+"%":"0"}
  function start(){if(P.dead||P.started)return;P.started=1;sh.classList.add("started");runHls(P)}
  function toggle(){if(!P.started){start();return}if(v.paused)v.play();else v.pause()}
  function fx(d){var e=$(d<0?"fxl":"fxr");e.textContent=(d<0?"−":"+")+Math.abs(d)+" ث";e.classList.remove("go");void e.offsetWidth;e.classList.add("go")}
  function skip(d){if(!P.started)return;v.currentTime=Math.max(0,Math.min((dur()||1e9)-.1,v.currentTime+d));fx(d);ui()}
  function volIc(){$("vol-icon").innerHTML=(v.muted||v.volume===0)?VOL_OFF:VOL_ON}
  function fs(){var d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);try{screen.orientation.unlock()}catch(e){}return}
    var f=sh.requestFullscreen||sh.webkitRequestFullscreen;if(f){var r=f.call(sh);if(r&&r.then)r.then(function(){try{screen.orientation.lock("landscape").catch(function(){})}catch(e){}}).catch(function(){})}else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}
  function menu(){var h='<h4>السرعة</h4><div class="opts">';[.5,.75,1,1.25,1.5,1.75,2].forEach(function(x){h+='<button type="button" data-sp="'+x+'"'+(v.playbackRate===x?' class="on"':"")+">"+(x===1?"عادية":x+"x")+"</button>"});
    h+='</div><h4>الجودة</h4><div class="opts"><button type="button" data-q="-1"'+(P.q<0?' class="on"':"")+">تلقائي</button>";
    P.lv.forEach(function(l,i){h+='<button type="button" data-q="'+i+'"'+(P.q===i?' class="on"':"")+">"+(l.height?l.height+"p":"L"+i)+"</button>"});mn.innerHTML=h+"</div>"}

  sh.onmousemove=ui;
  $("pclose").onclick=function(){destroyPlayer(1)};
  $("pc").onclick=function(e){e.stopPropagation();toggle()};$("pplay").onclick=toggle;
  $("pb").onclick=function(){skip(-10)};$("pf").onclick=function(){skip(10)};$("pfs").onclick=fs;
  $("pmute").onclick=function(){v.muted=!v.muted;volIc()};
  $("pvol").oninput=function(){v.volume=+this.value/100;v.muted=v.volume===0;volIc()};
  $("pset").onclick=function(e){e.stopPropagation();menu();mn.classList.toggle("open")};
  mn.onclick=function(e){e.stopPropagation();var b=e.target.closest("button");if(!b)return;
    if(b.hasAttribute("data-sp")){v.playbackRate=+b.getAttribute("data-sp");toast("السرعة "+b.getAttribute("data-sp")+"x")}
    if(b.hasAttribute("data-q")){P.q=+b.getAttribute("data-q");if(P.hls)P.hls.currentLevel=P.q;toast("تم تغيير الجودة")}menu()};
  $("pretry").onclick=function(){$("perror").style.display="none";try{if(P.hls)P.hls.destroy()}catch(e){}P.hls=null;runHls(P)};
  $("ptap").onclick=function(e){
    if(mn.classList.contains("open")){mn.classList.remove("open");return}
    var n=Date.now(),r=this.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,mouse=e.pointerType==="mouse"||(!e.pointerType&&matchMedia("(hover:hover)").matches);
    if(n-lt<300){clearTimeout(tt);lt=0;if(x<.35)skip(-10);else if(x>.65)skip(10);else fs();return}
    lt=n;tt=setTimeout(function(){if(!P.started){start();return}
      if(mouse){toggle();ui()}else if(sh.classList.contains("show-ui")){clearTimeout(P.ui);sh.classList.remove("show-ui")}else ui()},280)};
  function ratio(e){var r=sk.getBoundingClientRect();return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))}
  sk.onpointerdown=function(e){if(!P.started)return;drag=1;sk.classList.add("drag");sk.setPointerCapture(e.pointerId);setBar(ratio(e));ui()};
  sk.onpointermove=function(e){var r=ratio(e),t=$("ptip");t.textContent=fmt(r*dur());t.style.left=r*100+"%";if(drag){setBar(r);$("ptime").textContent=fmt(r*dur())+" / "+fmt(dur())}};
  sk.onpointerup=sk.onpointercancel=function(e){if(!drag)return;drag=0;sk.classList.remove("drag");var d=dur();if(d>0)v.currentTime=ratio(e)*d};
  P.kd=function(e){var k=e.key;if(k===" "&&e.target.tagName==="BUTTON")return;
    if(k===" "||k==="k"){e.preventDefault();toggle()}else if(k==="ArrowRight")skip(5);else if(k==="ArrowLeft")skip(-5);else if(k==="j")skip(-10);else if(k==="l")skip(10);
    else if(k==="ArrowUp"||k==="ArrowDown"){e.preventDefault();v.volume=Math.max(0,Math.min(1,v.volume+(k==="ArrowUp"?.1:-.1)));$("pvol").value=v.volume*100;volIc()}
    else if(k==="m"){v.muted=!v.muted;volIc()}else if(k==="f")fs();else if(k==="Escape"&&!document.fullscreenElement)destroyPlayer(1);ui()};
  document.addEventListener("keydown",P.kd);

  v.ontimeupdate=function(){if(P.dead)return;var d=dur(),t=v.currentTime||0;P.pct=d>0?Math.min(100,t/d*100):0;
    if(!drag){$("ptime").textContent=fmt(t)+" / "+fmt(d);setBar(d>0?t/d:0)}buf();
    if(Date.now()-P.last>=2000){P.last=Date.now();setW(id,{title:title,currentTime:t,duration:d,percent:P.pct,watched:P.pct>=90})}};
  v.onprogress=buf;
  v.onplay=function(){if(!P.started){P.started=1;sh.classList.add("started")}setIc(1);ui()};
  v.onpause=function(){setIc(0);sh.classList.add("show-ui")};
  v.onwaiting=function(){if(P.started)showLoad("")};v.onplaying=v.oncanplay=hideLoad;
  v.onended=function(){if(nx)toast("الفيديو التالي جاهز ⏭");setIc(0);sh.classList.add("show-ui");setW(id,{title:title,currentTime:0,duration:dur(),percent:100,watched:true})};
  v.onloadedmetadata=function(){var sv=P.saved;if(!P.hls&&sv&&sv.currentTime>2&&!sv.watched){try{v.currentTime=Math.min(+sv.currentTime,Math.max(0,v.duration-.5))}catch(e){}}};
  v.onerror=function(){if(!P.dead&&v.getAttribute("src"))perr("الفيديو لم يُشغّل")};
}
function runHls(P){
  showLoad("جاري التحميل…");
  api("/api/play/"+encodeURIComponent(P.id),{method:"POST"}).then(function(res){
    if(P.dead)return;
    if(!res||!res.success||!res.data||!res.data.manifest_url)throw new Error("بيانات التشغيل ناقصة");
    var u=apiUrl(res.data.manifest_url);if(S.token)u+=(u.indexOf("?")>=0?"&":"?")+"token="+encodeURIComponent(S.token);
    if(!window.Hls||!Hls.isSupported()){P.v.src=u;return P.v.play().catch(function(){})}
    var sv=P.saved,h=new Hls({enableWorker:true,maxBufferLength:30,maxMaxBufferLength:60,backBufferLength:15,capLevelToPlayerSize:true,startPosition:sv&&sv.currentTime>2&&!sv.watched?+sv.currentTime:-1,xhrSetup:function(x){if(S.token)x.setRequestHeader("Authorization","Bearer "+S.token)}}),nr=0;
    P.hls=h;
    h.on(Hls.Events.MANIFEST_PARSED,function(_e,d){P.lv=d.levels||[];hideLoad();P.v.play().catch(function(){})});
    h.on(Hls.Events.LEVEL_LOADED,function(_e,d){var t=+(d&&d.details&&d.details.totalduration);if(t>0)P.dur=t});
    h.on(Hls.Events.ERROR,function(_e,d){if(!d||!d.fatal)return;
      if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&nr++<3){h.startLoad();return}
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&nr++<3){h.recoverMediaError();return}
      perr("تعذّر تشغيل الفيديو ("+(d.details||"خطأ")+")")});
    h.loadSource(u);h.attachMedia(P.v);
  }).catch(function(e){if(!P.dead)perr(e.message||"فشل")});
}

var sa=API_BASE,st=lsGet(LS_TOKEN);
if(st){
  S.api=sa;S.token=st;
  api("/api/auth/me").then(function(d){
    S.me=d.data;S.yearId=d.data.yearId||4;S.subjectIds=(d.data.subjectIds||[]).map(String);enterApp();
  }).catch(function(){forceOut()});
}
})();
</script>
