<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المواد الدراسية | كورساتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* تنسيقات خاصة بصفحة المواد */
#app { padding-top: 30px; padding-bottom: 60px; max-width: 1160px; margin: auto; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; }
.card {
  background: var(--panel); border-radius: 20px; border: 1px solid var(--line);
  overflow: hidden; cursor: pointer; transition: transform .3s, box-shadow .3s;
}
.card:hover { transform: translateY(-5px); box-shadow: 0 14px 34px rgba(0,0,0,.45); border-color: rgba(255,107,26,.4); }
.card-img-wrapper {
  position: relative; height: 160px;
  background: linear-gradient(135deg, #2b1a00, #1a1000);
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; color: var(--orange2);
}
.card-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.card-title { font-size: 1.15rem; font-weight: 800; line-height: 1.4; }
.card-meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; }
.btn-gradient {
  width: 100%; background: linear-gradient(90deg, var(--orange), var(--orange3));
  color: #fff; border: none; padding: 12px; border-radius: 12px;
  font-size: 0.95rem; font-weight: 800; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .25s;
}
.btn-gradient:hover { opacity: 0.9; }
.back-btn-top {
  position: absolute; right: 0; top: 20px;
  display: flex; align-items: center; gap: 8px;
  background: var(--panel); border: 1px solid var(--line);
  color: var(--text); padding: 8px 16px; border-radius: 12px;
  cursor: pointer; font-size: 0.9rem; font-weight: 700; transition: .2s;
}
.back-btn-top:hover { background: rgba(255,255,255,.05); border-color: var(--orange); }
.page-title-area { text-align: center; margin-bottom: 40px; position: relative; }
.page-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,107,26,0.1); color: var(--orange2);
  padding: 6px 16px; border-radius: 20px; font-size: 0.85rem;
  margin-bottom: 12px; border: 1px solid rgba(255,107,26,0.2);
  font-weight: 800;
}
.page-title-area h1 { font-size: 2rem; margin-bottom: 8px; line-height: 1.25; font-weight: 900; }
.page-title-area h1 span { color: var(--orange); }
.page-title-area p { color: var(--muted); font-size: 0.95rem; }
.teacher-card {
  background: var(--panel); border-radius: 20px; border: 1px solid var(--line);
  padding: 20px; display: flex; flex-direction: column; gap: 16px; cursor: pointer;
  transition: .3s;
}
.teacher-card:hover { border-color: rgba(255,107,26,.4); transform: translateY(-4px); }
.teacher-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.teacher-info { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 4px; }
.teacher-role { font-size: 0.8rem; color: var(--orange2); font-weight: 800; }
.teacher-name { font-size: 1.15rem; font-weight: 800; line-height: 1.3; }
.teacher-avatar {
  width: 70px; height: 70px; border-radius: 16px; object-fit: cover;
  border: 2px solid var(--line); flex-shrink: 0;
  background: linear-gradient(135deg, #2b1a00, #1a1000);
  display: flex; align-items: center; justify-content: center;
  color: var(--orange2); font-size: 1.5rem;
}
.teacher-stats {
  background: rgba(255,255,255,.03); padding: 10px 16px; border-radius: 12px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 700; font-size: 0.9rem;
}
.count-badge {
  background: linear-gradient(90deg, var(--orange), var(--orange3));
  color: #fff; width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 0.85rem; font-weight: 800;
}
.loading-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.spinner {
  width: 44px; height: 44px; border: 3px solid rgba(255,255,255,.15);
  border-top-color: var(--orange); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Video cards */
.video-card {
  background: var(--panel); border-radius: 16px; overflow: hidden;
  border: 1px solid var(--line); display: flex; flex-direction: column;
  cursor: pointer; transition: .25s;
}
.video-card:hover { transform: translateY(-4px); border-color: rgba(255,107,26,.4); }
.video-thumbnail {
  position: relative; height: 150px;
  background: linear-gradient(135deg, #2b1a00, #1a1000);
  display: flex; align-items: center; justify-content: center;
  color: var(--orange2); font-size: 2rem;
}
.video-num-badge {
  position: absolute; top: 10px; right: 10px;
  background: rgba(0,0,0,.7); color: #fff; font-size: 0.8rem;
  padding: 4px 10px; border-radius: 6px; font-weight: 700;
}
.video-duration-badge {
  position: absolute; bottom: 10px; left: 10px;
  background: rgba(0,0,0,.7); color: #fff; font-size: 0.8rem;
  padding: 3px 8px; border-radius: 6px; font-weight: 700;
}
.video-info { padding: 16px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
.video-title { font-size: 0.95rem; font-weight: 800; line-height: 1.4; }

.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line);
}
.section-header h2 { font-size: 1.3rem; font-weight: 800; }

.content-icon-box { background: rgba(255,255,255,.03); padding: 12px; border-radius: 12px; display: flex; gap: 8px; }
.content-icon-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 6px; border-radius: 8px; background: rgba(255,255,255,.03); font-size: 0.9rem; font-weight: 800; }
.content-icon-item svg { width: 20px; height: 20px; color: var(--orange); margin-bottom: 4px; }
.content-icon-item small { color: var(--muted); font-size: 0.75rem; font-weight: 600; }

.lecture-card { background: var(--panel); border-radius: 20px; border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.lecture-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.lecture-year { font-size: 0.85rem; color: var(--orange2); font-weight: 800; }
.lecture-title { font-size: 1.1rem; font-weight: 800; line-height: 1.4; }

/* Back to top button */
.back-to-top {
  position: fixed; bottom: 24px; left: 24px;
  background: var(--panel); border: 1px solid var(--line);
  color: var(--text); width: 44px; height: 44px;
  border-radius: 50%; display: grid; place-items: center;
  cursor: pointer; z-index: 50; font-size: 1.2rem;
  transition: .2s;
}
.back-to-top:hover { border-color: var(--orange); color: var(--orange); }
</style>
</head>
<body>

<header class="nav">
  <div class="container navin">
    <a class="brand" href="index.html">
      <span class="logo">🎓</span>
      <span>كورساتك<small>منصة تعليمية</small></span>
    </a>
    <div class="navactions">
      <button class="btn btn-soft" onclick="goProfile()">👤 حسابي</button>
      <button class="btn btn-primary" onclick="logout()">🚪 خروج</button>
    </div>
  </div>
</header>

<main id="app" class="container">
  <div class="loading-state">
    <div class="spinner"></div>
    جاري تحميل المواد...
  </div>
</main>

<button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="لأعلى">↑</button>

<script>
function goProfile() { window.location.href = 'profile.html'; }
function logout() {
  if (!confirm('متأكد إنك عايز تسجّل الخروج؟')) return;
  localStorage.removeItem('cstk_tok');
  window.location.href = 'index.html';
}
if (!localStorage.getItem('cstk_tok')) {
  window.location.href = 'index.html';
}
</script>
<script src="app.js"></script>

</body>
</html>
