<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المواد — ثانوية World</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
</head>
<body>
  <header class="topbar">
    <div class="logo" onclick="goHome()">ثانوية World</div>
    <div class="header-actions" style="display:flex;align-items:center;gap:12px">
      <a href="/profile.html" style="color:var(--accent);font-size:0.88rem;font-weight:600;text-decoration:none;padding:8px 14px;background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);border-radius:8px">ملفي</a>
      <button onclick="logout()" style="background:transparent;border:1px solid var(--border-light);color:var(--text-muted);padding:8px 14px;border-radius:8px;font-size:0.88rem;font-weight:600;cursor:pointer;font-family:inherit">خروج</button>
    </div>
  </header>

  <main id="app">
    <div class="loading">جاري التحميل...</div>
  </main>

  <div id="player-modal" class="modal hidden">
    <div class="player-container">
      <div class="player-header">
        <h3 id="player-title"></h3>
        <button class="close-btn" onclick="closePlayer()">✕</button>
      </div>
      <div class="video-wrapper">
        <video id="video" controls playsinline></video>
        <div id="player-status" class="status"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var tok = null;
      try {
        tok = localStorage.getItem("cstk_tok") || sessionStorage.getItem("cstk_tok");
      } catch (e) {}
      if (!tok) {
        window.location.href = "/index.html";
        return;
      }
      window.logout = function () {
        try {
          localStorage.removeItem("cstk_tok");
          localStorage.removeItem("cstk_code");
          localStorage.removeItem("cstk_me");
        } catch (e) {}
        window.location.href = "/index.html";
      };
    })();
  </script>
  <script src="/app.js"></script>
</body>
</html>
