<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>المواد الدراسية | كورساتك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* تنسيقات خاصة بصفحة المواد */
body { padding-bottom: 40px; }
.app-container { max-width: 1200px; margin: 0 auto; padding: 32px 24px 60px; }
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 16px;
  color: var(--text-secondary);
}
.spinner {
  width: 48px;
  height: 48px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--orange);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Breadcrumbs & Navigation */
.breadcrumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 24px;
  padding: 12px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 0.9rem;
  flex-wrap: wrap;
}
.breadcrumbs a, .breadcrumbs button {
  color: var(--orange-light);
  font-weight: 700;
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
  font-size: 0.9rem;
  transition: var(--transition);
}
.breadcrumbs a:hover, .breadcrumbs button:hover {
  color: var(--orange);
  text-decoration: underline;
}
.breadcrumbs .sep { color: var(--text-muted); }
.breadcrumbs .current { color: var(--text-primary); font-weight: 700; }

/* Page header */
.page-header {
  text-align: center;
  margin-bottom: 40px;
}
.page-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 107, 26, 0.1);
  border: 1px solid rgba(255, 107, 26, 0.3);
  color: var(--orange-light);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 16px;
}
.page-header h1 {
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  font-weight: 900;
  margin-bottom: 8px;
}
.page-header h1 span { color: var(--orange-light); }
.page-header p { color: var(--text-secondary); font-size: 1rem; }

/* Grids */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .app-container { padding: 20px 16px 40px; }
}

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
}
.card:hover {
  border-color: var(--border-hover);
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
}
.card-image {
  height: 160px;
  background: linear-gradient(135deg, rgba(255, 107, 26, 0.3), rgba(255, 107, 26, 0.1));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3.5rem;
  color: var(--orange-light);
  position: relative;
}
.card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}
.card-title {
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1.4;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-top: auto;
}
.card-cta {
  width: 100%;
  padding: 12px;
  background: var(--orange);
  color: white;
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.95rem;
  text-align: center;
  margin-top: 8px;
  transition: var(--transition);
}
.card:hover .card-cta {
  background: var(--orange-light);
  box-shadow: 0 8px 24px var(--orange-glow);
}

/* Teacher cards */
.teacher-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.teacher-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
}
.teacher-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.teacher-info { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 4px; }
.teacher-role { font-size: 0.8rem; color: var(--orange-light); font-weight: 800; }
.teacher-name { font-size: 1.15rem; font-weight: 800; }
.teacher-avatar {
  width: 70px;
  height: 70px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--orange), var(--orange-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  color: white;
  flex-shrink: 0;
  object-fit: cover;
}
.teacher-stats {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  font-size: 0.9rem;
  font-weight: 700;
}
.count-badge {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--orange);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 0.9rem;
}

/* Lecture / Video cards */
.lecture-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transition: var(--transition);
}
.lecture-card:hover {
  border-color: var(--border-hover);
}
.lecture-header { display: flex; flex-direction: column; gap: 4px; }
.lecture-num { font-size: 0.8rem; color: var(--orange-light); font-weight: 800; }
.lecture-title { font-size: 1.1rem; font-weight: 800; line-height: 1.4; }

.content-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.content-stat {
  background: rgba(255, 255, 255, 0.03);
  border-radius: 12px;
  padding: 12px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.content-stat-icon { font-size: 1.3rem; }
.content-stat-value { font-size: 1.1rem; font-weight: 900; color: var(--orange-light); }
.content-stat-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; }

/* Videos */
.video-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  flex-direction: column;
}
.video-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-4px);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
}
.video-thumb {
  height: 160px;
  background: linear-gradient(135deg, rgba(255, 107, 26, 0.4), rgba(255, 107, 26, 0.15));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: white;
  position: relative;
}
.video-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 800;
}
.video-duration {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 0.8rem;
  font-weight: 800;
}
.video-info {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.video-title {
  font-size: 0.95rem;
  font-weight: 800;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.video-play-btn {
  padding: 10px;
  background: var(--orange);
  color: white;
  border-radius: 10px;
  font-weight: 800;
  text-align: center;
  font-size: 0.9rem;
}

/* PDF cards */
.pdf-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: var(--transition);
}
.pdf-card:hover { border-color: var(--border-hover); }
.pdf-icon {
  width: 56px;
  height: 56px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(255, 107, 26, 0.2), rgba(255, 107, 26, 0.05));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  flex-shrink: 0;
}
.pdf-info { flex: 1; min-width: 0; }
.pdf-title {
  font-size: 0.95rem;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pdf-cta {
  background: var(--orange);
  color: white;
  padding: 8px 16px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 0.85rem;
  text-decoration: none;
  white-space: nowrap;
}

/* Header user */
.user-header {
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 30px;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: var(--transition);
}
.user-chip:hover { border-color: var(--orange); }
.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--orange), var(--orange-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 900;
  font-size: 0.9rem;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-state-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.5; }
.empty-state h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; color: var(--text-primary); }

/* Error state */
.error-state {
  text-align: center;
  padding: 60px 20px;
}
.error-state-icon { font-size: 3rem; margin-bottom: 16px; }
.error-state h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 8px; color: #ff8a80; }
.error-state p { color: var(--text-secondary); margin-bottom: 20px; }
.error-state button {
  background: var(--orange);
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 800;
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="subjects.html" class="nav-brand">
      <span class="brand-icon">🎓</span>
      <span class="brand-text">كورساتك</span>
    </a>
    <div class="user-header">
      <div class="user-chip" onclick="window.location.href='index.html'">
        <span class="user-avatar">👤</span>
        <span>حسابي</span>
      </div>
      <button class="btn-login" onclick="logout()">خروج</button>
    </div>
  </div>
</nav>

<main class="app-container">
  <div class="loading-screen">
    <div class="spinner"></div>
    <p>جاري تحميل البيانات...</p>
  </div>
</main>

<script src="app.js"></script>

</body>
</html>
