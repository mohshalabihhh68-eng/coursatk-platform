<!DOCTYPE html>
<html lang="ar-EG" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المحاضرات | ثانوية club</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b14;--card:#121a2b;--ink:#eef2ff;--muted:#8b9bb8;--line:rgba(148,163,184,.12);--blue:#3b82f6;--blue2:#60a5fa;--blue3:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}
button{font:inherit;cursor:pointer}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.app-nav{position:sticky;top:0;z-index:40;background:rgba(7,11,20,.88);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.app-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;cursor:pointer}
.brand img{width:36px;height:36px;border-radius:11px}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.profile-wrap{position:relative;margin-right:auto}
.profile-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font-weight:800;font-size:12px;color:var(--ink)}
.profile-btn .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue3));color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.profile-menu{position:absolute;top:calc(100% + 8px);left:0;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:none;z-index:50}
.profile-menu.open{display:block}
.profile-menu button{width:100%;text-align:right;border:0;background:transparent;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:700;font-size:13px;display:flex;align-items:center;gap:10px;color:var(--ink)}
.profile-menu button:hover{background:rgba(255,255,255,.04)}
.profile-menu button.danger{color:#ff8a80}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 90px}
.back-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer;margin-bottom:14px;color:var(--ink)}
.page-head{margin-bottom:22px;animation:fadeUp .4s ease}
.page-head .badge{display:inline-flex;align-items:center;gap:6px;background:rgba(59,130,246,.12);color:var(--blue2);border:1px solid rgba(59,130,246,.2);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.page-head h1{margin:0;font-size:26px;font-weight:900}
.page-head p{margin:8px 0 0;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:12px}
.list-item{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;cursor:pointer;transition:.2s;animation:fadeUp .35s ease both}
.list-item:hover{background:#182234;transform:translateX(-4px);border-color:rgba(59,130,246,.4)}
.list-item img{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#101b31}
.list-item .title{font-size:16px;font-weight:800;margin-bottom:4px}
.list-item .meta{font-size:12px;color:var(--muted)}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
</style>
</head>
<body>
  <header class="app-nav"><div class="app-nav-in">
    <div class="brand" id="brand-home"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M32 14 8 26l24 12 24-12z' fill='%23fff'/%3E%3C/svg%3E" alt=""><div>ثانوية club<small>منصة الثانوية العامة</small></div></div>
    <div class="profile-wrap"><button type="button" class="profile-btn" id="profile-btn"><span class="av" id="nav-av">?</span><span id="nav-name">—</span></button><div class="profile-menu" id="profile-menu"><button type="button" id="menu-account">حسابي</button><button type="button" class="danger" id="menu-logout">خروج</button></div></div>
  </div></header>

  <main class="wrap" id="main"><div class="loading"><div class="spinner"></div><p>جاري تحميل المحاضرات...</p></div></main>

<script>
(function(){
'use strict';
const API_BASE = '', TOKEN_KEY = 'cstk_tok', token = localStorage.getItem(TOKEN_KEY);
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const chapterId = qs.get('chapterId');
const chapterName = qs.get('chapterName') || '';
const teacherName = qs.get('teacherName') || '';
const subjectName = qs.get('subjectName') || '';

const api = async (path, opts = {}) => {
  const headers = { Accept: 'application/json', ...opts.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { method: opts.method || 'GET', headers, body: opts.body });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === false) throw new Error(data.message || data.error || 'خطأ في السيرفر');
  return data.data;
};
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function load() {
  if (!chapterId) { $('main').innerHTML = '<div style="text-align:center;padding:50px">معرف الفصل غير موجود.</div>'; return; }
  try {
    const lectures = await api('/api/chapters/' + chapterId + '/lectures');
    if (!lectures || !lectures.length) { $('main').innerHTML = '<div style="text-align:center;padding:50px;color:var(--muted)">لا يوجد محاضرات.</div>'; return; }
    
    let html = `<button class="back-btn" onclick="history.back()">← رجوع</button>
    <div class="page-head">
      <div class="badge">المحاضرات</div>
      <h1>محاضرات الفصل</h1>
      <p>اختار المحاضرة لفتح المحتوى</p>
    </div>
    <div class="list">`;
    
    lectures.forEach(l => {
      // هنا التعديل: ضفنا lectureName=${encodeURIComponent(l.name)} في الرابط
      html += `<div class="list-item" onclick="window.location.href='content.html?lectureId=${l.id}&chapterName=${encodeURIComponent(chapterName)}&teacherName=${encodeURIComponent(teacherName)}&subjectName=${encodeURIComponent(subjectName)}&lectureName=${encodeURIComponent(l.name)}'">
        <img src="${esc(l.image_url || '')}" onerror="this.style.opacity=0.2">
        <div><div class="title">${esc(l.name)}</div><div class="meta">${l.video_count || 0} فيديو</div></div>
      </div>`;
    });
    html += '</div>'; $('main').innerHTML = html;
  } catch (e) { $('main').innerHTML = `<div style="text-align:center;color:#ff5252">خطأ: ${e.message}</div>`; }
}
async function loadProfile() { try { const me = await api('/api/profile'); $('nav-name').textContent = me.name || 'طالب'; $('nav-av').textContent = (me.name || 'ط').charAt(0); } catch (e) {} }
$('brand-home').onclick = () => window.location.href = 'subjects.html';
$('profile-btn').onclick = () => $('profile-menu').classList.toggle('open');
document.addEventListener('click', (e) => { if (!e.target.closest('.profile-wrap')) $('profile-menu').classList.remove('open'); });
$('menu-account').onclick = () => window.location.href = 'profile.html';
$('menu-logout').onclick = () => { localStorage.removeItem(TOKEN_KEY); window.location.replace('index.html'); };
load(); loadProfile();
})();
</script>
</body>
</html>
